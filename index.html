  //   student's measure targets live, NO lights - that is the whole test
  //   got it     -> the next pattern in the list
  //   did not    -> the same pattern demonstrated again
  //
  // BOOM is the circle on the left and plays the kick; CLAP is the square on
  // the right and plays the clap. Shape, side and sound never change.
  //
  // NO SPEECH. Not an intro, not praise, not correction, not a count-in in
  // words. Everything the student needs to know is carried by the groove, the
  // lights and the lock. An earlier version talked constantly and it was the
  // first thing that had to go.
  //
  // WHAT IS JUDGED, AND WHAT IS NOT
  //   Only WHICH SHAPE lands in WHICH SLOT. The measure is cut into equal
  //   slots and a tap belongs to the nearest one, so the tolerance is half a
  //   slot either side - about 395 ms at quarter notes. There is deliberately
  //   no early/late reading, no accuracy percentage and nothing said about
  //   timing; a learner needs the ORDER before they need the microseconds.
  //
  // WHY THE AUDIO CLOCK IS THE ONLY CLOCK
  //   Everything musical is scheduled on the AudioContext clock and nothing
  //   musical waits on setTimeout. A scheduler queues the next 1.2 s of audio
  //   ahead of the playhead, so the beat stays sample-accurate while the main
  //   thread is busy laying out a flash. Visual cues fire from a rAF loop that
  //   compares against what is CURRENTLY BEING HEARD (getOutputTimestamp), and
  //   tap times come from that same clock. Animation timing is never consulted
  //   for anything that is judged.
  //
  // THE GROOVE NEVER STOPS
  //   One continuous grid runs from the moment the section opens until the ⌂
  //   takes it back. Hats and bass play underneath everything, including the
  //   student's own measure, so the pulse is never lost and nothing ever cuts
  //   out to mark a mistake.

  // -------- dials ---------------------------------------------------------
  const RHYTHM_BPM            = 84;
  const RHYTHM_METER          = 4;
  // One tap's worth of slop either side of a slot, as a fraction of the slot.
  // 0.5 means the slots simply tile the measure and the nearest one wins.
  const RHYTHM_SLOT_SLOP      = 0.5;
  // How many call-and-responses the BRAIN-BREAK shape runs before handing back.
  // The activity ignores this and goes until the adult leaves.
  const RHYTHM_BREAK_TASKS    = 3;
  // A short rising figure when a measure comes back correct. Not speech, and
  // not a score - just the sound of a door opening. false makes success silent.
  const RHYTHM_SUCCESS_CHIME  = true;
  // Seconds of audio queued ahead of the playhead, and how often we top it up.
  // The ratio is deliberately huge: a browser may throttle BOTH setTimeout and
  // requestAnimationFrame to one call a second - measured, a remote-debugged
  // tab does exactly that - and at 60 ms asked against 1.2 s queued the beat
  // still does not gap. Queueing further ahead costs nothing, because a
  // teardown mutes the whole bus in one move.
  const RHYTHM_SCHEDULE_AHEAD = 1.2;
  const RHYTHM_SCHEDULE_EVERY = 60;
  const RHYTHM_LEAD_IN        = 0.35;
  // Overall level for the whole kit. 0.9 because measured offline, a downbeat
  // with the kick, the bass and an accented hat all landing together summed to
  // 1.022 and clipped before it ever reached the limiter. The limiter would
  // have caught it, but a limiter catching every downbeat is how a mix starts
  // breathing in and out.
  const RHYTHM_LEVEL          = 0.9;

  // -------- the patterns --------------------------------------------------
  // One measure each, in a drummer's order rather than a programmer's: the
  // backbeat first, then the kick variations a beginner actually meets, then
  // the eighth-note placements that make a groove swing.
  //
  //   'B' the student plays BOOM     'C' the student plays CLAP
  //   '-' nothing on this slot
  //
  // `div` is slots per beat, so slots.length must be RHYTHM_METER*div - div 1
  // is quarter notes, div 2 is eighths. Checked at load.
  //
  // The FIRST one is the one he is taught by being shown: boom clap boom clap.
  // Everything after it is a variation on that, never longer than a measure.
  const RHYTHM_PATTERNS = [
    // --- quarters: the shape of the thing -------------------------------
    { slots:['B','C','B','C'], div:1 },        // boom clap boom clap
    { slots:['B','-','C','-'], div:1 },        // the basic backbeat: kick 1, snare 3
    { slots:['B','B','C','-'], div:1 },        // double kick into the backbeat
    { slots:['B','-','C','B'], div:1 },        // ...with a kick picking up beat 4
    { slots:['B','C','C','B'], div:1 },
    { slots:['B','B','C','C'], div:1 },
    { slots:['B','C','B','B'], div:1 },
    // --- eighths: standard rock and pop placements ----------------------
    { slots:['B','-','-','-','C','-','-','-'], div:2 },   // bare backbeat
    { slots:['B','-','-','B','C','-','-','-'], div:2 },   // kick on the "and of 2"
    { slots:['B','-','-','-','C','-','B','-'], div:2 },   // kick picking up beat 4
    { slots:['B','-','C','-','B','-','C','-'], div:2 },   // boots and cats
    { slots:['B','-','-','B','C','-','B','-'], div:2 },   // the one most pop songs are
    { slots:['B','B','-','-','C','-','-','B'], div:2 },   // double kick, pickup at the end
    { slots:['B','-','-','C','-','B','C','-'], div:2 },   // syncopated clap
    { slots:['B','-','C','B','-','-','C','-'], div:2 }
  ];

  // The backing groove, one measure of eighths. Hats all the way through with
  // the downbeats accented and the last eighth open, and a bass line on 1, the
  // "and of 2" and 3 with a pickup at the end of the bar. It carries the pulse
  // THROUGH the student's own measure, which is what keeps them in time when
  // nothing is lighting up.
  //
  // Neither the kick nor the clap appears here, on purpose: those two sounds
  // belong to the student, and a backing that used them would make it
  // impossible to hear whose note was whose.
  const RHYTHM_HATS = [  // one per eighth: accent level, or 'o' for open
    1, .45, .6, .45, .9, .45, .6, 'o'
  ];
  const RHYTHM_BASSLINE = [  // [eighth index, frequency, length in beats]
    [0,'A',.9], [3,'A',.45], [4,'C',.9], [7,'G',.4]
  ];
  // ---- the kit -----------------------------------------------------------
  // Everything the section makes goes through one gain node, so a teardown can
  // silence audio that is already scheduled in a single move. A short reverb
  // hangs off it as a send: the hats and the clap go to it, the kick and the
  // bass do not, which is how a real mix is balanced and is most of why this
  // stops sounding like a test tone.
  function rhythmBus() {
    const ac=audio(); if (!ac) return null;
    if (rBus) return rBus;
    rBus=ac.createGain(); rBus.gain.value=RHYTHM_LEVEL; rBus.connect(masterGain);
    // A tiny plate: exponentially decaying noise as an impulse response. Half
    // a second is enough to put the kit in a room rather than in a vacuum.
    rVerb=ac.createConvolver();
    const n=Math.floor(ac.sampleRate*.5);
    const buf=ac.createBuffer(2,n,ac.sampleRate);
    for (let c=0;c<2;c++) {
      const d=buf.getChannelData(c);
      for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);
    }
    rVerb.buffer=buf;
    rVerbSend=ac.createGain(); rVerbSend.gain.value=.16;
    rVerbSend.connect(rVerb); rVerb.connect(rBus);
    return rBus;
  }
  function rKeep(node) { rNodes.push(node); }

  // A curve that rounds peaks off instead of clipping them. The kick is the
  // loudest thing here and it is the one that would otherwise crackle.
  function rhythmDrive(ac,amount) {
    const sh=ac.createWaveShaper();
    const n=1024, curve=new Float32Array(n);
    for (let i=0;i<n;i++) {
      const x=i*2/n-1;
      curve[i]=Math.tanh(x*amount)/Math.tanh(amount);
    }
    sh.curve=curve; sh.oversample='2x';
    return sh;
  }

  function rhythmWhite(ac) {
    if (rWhite) return rWhite;
    const n=Math.floor(ac.sampleRate*1.5);
    rWhite=ac.createBuffer(1,n,ac.sampleRate);
    const d=rWhite.getChannelData(0);
    for (let i=0;i<n;i++) d[i]=Math.random()*2-1;
    return rWhite;
  }
  function rhythmNoise(ac,t,dur) {
    const n=ac.createBufferSource();
    n.buffer=rhythmWhite(ac);
    n.start(t, Math.random()*(1.5-dur-.02));
    n.stop(t+dur);
    rKeep(n);
    return n;
  }

  // BOOM. Two layers: a sub that sweeps 165 -> 45 Hz for the body, and a
  // short mid thump at 90 Hz that gives it somewhere to sit on a tablet
  // speaker, which reproduces almost nothing below ~150 Hz. Driven through
  // tanh so the transient rounds over instead of clipping.
  function rhythmKick(t,vol=1) {
    const ac=audio(); const bus=rhythmBus(); if (!ac||!bus) return;
    // One output for the whole drum, and EVERYTHING goes through it - the
    // beater click included. The click used to connect straight to the bus,
    // which meant it summed on top of the waveshaper's ceiling instead of
    // under it, and the kick peaked at 1.046 however far the gain was pulled
    // down. That is the kind of clipping you hear as "cheap" and never find
    // by reading the gain values.
    const out=ac.createGain(); out.gain.value=.78; out.connect(bus);
    const drive=rhythmDrive(ac,2.2); drive.connect(out);
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t);
    // 0.8, not 1.0: measured offline, the sub and the thump summed to a peak
    // of 1.041 and clipped the buffer even through the tanh stage.
    g.gain.linearRampToValueAtTime(.8*vol,t+.003);
    g.gain.exponentialRampToValueAtTime(.0008,t+.34);
    g.connect(drive);
    const sub=ac.createOscillator(); sub.type='sine';
    sub.frequency.setValueAtTime(165,t);
    sub.frequency.exponentialRampToValueAtTime(45,t+.085);
    sub.connect(g); sub.start(t); sub.stop(t+.38); rKeep(sub);
    const thump=ac.createOscillator(); thump.type='triangle';
    thump.frequency.setValueAtTime(220,t);
    thump.frequency.exponentialRampToValueAtTime(90,t+.05);
    const tg=ac.createGain();
    tg.gain.setValueAtTime(.34*vol,t);
    tg.gain.exponentialRampToValueAtTime(.0005,t+.1);
    thump.connect(tg); tg.connect(drive); thump.start(t); thump.stop(t+.12); rKeep(thump);
    // The beater. Without it the kick is felt rather than heard on a small speaker.
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1400;
    const cg=ac.createGain();
    cg.gain.setValueAtTime(.2*vol,t);
    cg.gain.exponentialRampToValueAtTime(.0005,t+.025);
    rhythmNoise(ac,t,.04).connect(hp); hp.connect(cg); cg.connect(out);
  }

  // CLAP. Not one noise burst but FOUR, 9 ms apart, with a longer tail on the
  // last - which is what a room full of hands actually sounds like and is the
  // single biggest reason the old one read as "computer". Bandpassed around
  // 1.1 kHz, with a little of the reverb send.
  const CLAP_OFFSETS=[0,.009,.019,.028];
  function rhythmClap(t,vol=1) {
    const ac=audio(); const bus=rhythmBus(); if (!ac||!bus) return;
    const bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=1150; bp.Q.value=1.6;
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=600;
    bp.connect(hp);
    // The bandpass at Q 1.6 throws most of a noise burst away, so this makes
    // it back up. Measured: at 0.9 the clap peaked 17 dB under the kick, which
    // on a tablet speaker meant the backbeat simply disappeared.
    const out=ac.createGain(); out.gain.value=3.2*vol;
    hp.connect(out); out.connect(bus); out.connect(rVerbSend);
    CLAP_OFFSETS.forEach((off,i)=>{
      const last=i===CLAP_OFFSETS.length-1;
      const g=ac.createGain();
      g.gain.setValueAtTime(0,t+off);
      g.gain.linearRampToValueAtTime(last?.5:.42,t+off+.001);
      g.gain.exponentialRampToValueAtTime(.0005,t+off+(last?.18:.012));
      rhythmNoise(ac,t+off,last?.2:.02).connect(g); g.connect(bp);
    });
    // A little tonal body so it has a pitch to sit at, not just a hiss.
    const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=320;
    const og=ac.createGain();
    og.gain.setValueAtTime(.12*vol,t);
    og.gain.exponentialRampToValueAtTime(.0005,t+.07);
    o.connect(og); og.connect(bus); o.start(t); o.stop(t+.09); rKeep(o);
  }

  // Hi-hat, the analog way: six square waves at deliberately inharmonic
  // ratios, squashed through a highpass. White noise through a filter - which
  // is what this used to be - reads as hiss; this reads as metal.
  const HAT_RATIOS=[2,3,4.16,5.43,6.79,8.21];
  function rhythmHat(t,{open=false,vol=1}={}) {
    const ac=audio(); const bus=rhythmBus(); if (!ac||!bus) return;
    const bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=open?8000:10000; bp.Q.value=.8;
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
    bp.connect(hp);
    const g=ac.createGain();
    const dur=open?.34:.052;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.26*vol,t+.0012);
    g.gain.exponentialRampToValueAtTime(.0004,t+dur);
    hp.connect(g); g.connect(bus); g.connect(rVerbSend);
    for (const r of HAT_RATIOS) {
      const o=ac.createOscillator(); o.type='square'; o.frequency.value=40*r;
      o.connect(bp); o.start(t); o.stop(t+dur+.02); rKeep(o);
    }
  }

  // The bass. This is the part that makes it a TRACK rather than a metronome,
  // and it is pitched at A2/C3/G2 on purpose - an octave above where a bass
  // would normally sit - so it never fights the kick for the same few hertz.
  const BASS_A=110, BASS_C=130.81, BASS_G=98;
  function rhythmBass(t,freq,dur=.3,vol=1) {
    const ac=audio(); const bus=rhythmBus(); if (!ac||!bus) return;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6;
    lp.frequency.setValueAtTime(freq*9,t);
    lp.frequency.exponentialRampToValueAtTime(freq*2.2,t+.12);
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t);
    // 0.11. The bass is BACKING - it carries the pulse and it is meant to be
    // felt more than listened to. At 0.22 it measured 6 dB under the kick,
    // which sounds reasonable written down and in practice sat right on top of
    // the student's own boom and clap and buried them. Halved, it is about
    // 12 dB down and the two drums are clearly in front of it again.
    g.gain.linearRampToValueAtTime(.11*vol,t+.012);
    g.gain.setValueAtTime(.11*vol,t+dur*.6);
    g.gain.exponentialRampToValueAtTime(.0006,t+dur);
    lp.connect(g); g.connect(bus);
    for (const [type,det,lvl] of [['sawtooth',0,.6],['square',0,.25],['sine',-12,.9]]) {
      const o=ac.createOscillator(); o.type=type;
      o.frequency.value=freq; o.detune.value=det;
      const og=ac.createGain(); og.gain.value=lvl;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+.05); rKeep(o);
    }
  }

  const rhythmEl   = document.getElementById('rhythm');
  const rBandEl    = document.getElementById('rhythmBand');
  const rBannerEl  = document.getElementById('rhythmBanner');
  const rBoomEl    = document.getElementById('rhythmBoom');
  const rClapEl    = document.getElementById('rhythmClap');

  let rOn=false, rOnFinish=null, rMode='activity';
  let rBus=null, rVerb=null, rVerbSend=null, rWhite=null;
  let rGrid=null;        // { beat0, beatDur, stepDur, nextStep }
  let rSections=[];      // measure-aligned script
  let rCues=[];          // pending visual / callback events, time-sorted
  let rNodes=[];         // started sources, so a teardown can silence them
  let rSched=null, rRaf=0, rBandTimer=null;
  let rNextMeasure=0;
  let rLive=null;        // the student's measure, while it is open
  let rLocked=true;      // true while the band is demonstrating
  // Which pattern they are on. Survives a trip to the menu and back, so the
  // section is picked up where it was left rather than restarted.
  let rTaskIdx=0, rAttempt=0, rPassed=0;

  for (const p of RHYTHM_PATTERNS)
    if (p.slots.length !== RHYTHM_METER*p.div)
      console.warn('rhythm: pattern ['+p.slots.join(' ')+'] has '+p.slots.length+
                   ' slots, expected '+RHYTHM_METER*p.div);

  function rhythmActive() { return rOn; }
  function rhythmTask() { return RHYTHM_PATTERNS[rTaskIdx % RHYTHM_PATTERNS.length]; }
  function rhythmMeasureTime(m) { return rGrid.beat0 + m*RHYTHM_METER*rGrid.beatDur; }
  function rhythmMeasureDur() { return RHYTHM_METER*rGrid.beatDur; }

  // ---- the heard clock ---------------------------------------------------
  // getOutputTimestamp().contextTime is the frame LEAVING the speaker right
  // now, so it already carries the output latency that currentTime does not.
  // That is the clock both a visual pulse and a tap have to be judged on.
  function rhythmHeardTime() {
    const ac=audioCtx; if (!ac) return 0;
    const ts = ac.getOutputTimestamp ? ac.getOutputTimestamp() : null;
    if (ts && Number.isFinite(ts.contextTime) && ts.contextTime>0) return ts.contextTime;
    return ac.currentTime - (ac.outputLatency || ac.baseLatency || 0);
  }
  function rhythmTapTime(perfMs) {
    const ac=audioCtx; if (!ac) return 0;
    const now=performance.now();
    const p=(Number.isFinite(perfMs) && Math.abs(now-perfMs)<2000) ? perfMs : now;
    const ts = ac.getOutputTimestamp ? ac.getOutputTimestamp() : null;
    if (ts && Number.isFinite(ts.contextTime) && ts.contextTime>0
           && Number.isFinite(ts.performanceTime))
      return ts.contextTime + (p - ts.performanceTime)/1000;
    return ac.currentTime - (ac.outputLatency || ac.baseLatency || 0);
  }

  // ---- presentation ------------------------------------------------------
  function rBanner(text) { rBannerEl.textContent=text; }
  function rhythmBandFlash(kind) {
    rBandEl.classList.remove('beat','downbeat');
    rBandEl.classList.add(kind);
    clearTimeout(rBandTimer);
    rBandTimer=setTimeout(()=>rBandEl.classList.remove('beat','downbeat'),90);
  }
  function rhythmFlash(el,cls,ms) {
    el.classList.add(cls);
    clearTimeout(el._rT);
    el._rT=setTimeout(()=>el.classList.remove(cls),ms);
  }
  const rTargetEl = which => which==='B' ? rBoomEl : rClapEl;
  // Greyed out = "the band is playing, your turn is coming". The lock is a
  // real gate, not a hint: taps are ignored while it is on, so a student
  // drumming along with the demonstration cannot accidentally spend their turn.
  function rhythmSetLocked(v) {
    rLocked=v;
    rBoomEl.classList.toggle('locked',v);
    rClapEl.classList.toggle('locked',v);
    rBoomEl.disabled=v; rClapEl.disabled=v;
  }
  function rhythmResetTargets() {
    for (const el of [rBoomEl,rClapEl]) {
      clearTimeout(el._rT);
      el.classList.remove('cue','hit','locked');
      el.disabled=false;
    }
    rBandEl.classList.remove('beat','downbeat');
  }
  // The sound of getting one right. ONE note, and a quiet one.
  //
  // It was a three-note rising figure, which took half a second, arrived
  // exactly as the next demonstration began and pulled attention off it. A
  // single ding says the same thing and is gone before the downbeat. G5 is the
  // note the splash chime ends on, so it is already this app's "yes".
  function rhythmChime(t) {
    if (!RHYTHM_SUCCESS_CHIME) return;
    const ac=audio(); const bus=rhythmBus(); if (!ac||!bus) return;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.16,t+.006);
    g.gain.exponentialRampToValueAtTime(.0005,t+.3);
    g.connect(bus); g.connect(rVerbSend);
    // A touch of the octave above keeps it bell-like rather than flute-like,
    // the same trick playTone() uses for the braille dot tones.
    for (const [f,lvl,type] of [[783.99,1,'triangle'],[1567.98,.22,'sine']]) {
      const o=ac.createOscillator(); o.type=type; o.frequency.value=f;
      const og=ac.createGain(); og.gain.value=lvl;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+.33); rKeep(o);
    }
  }

  // ---- input -------------------------------------------------------------
  function rhythmTap(which,perfMs) {
    if (!rOn || rLocked) return;
    const ac=audio(); if (!ac) return;
    if (which==='B') rhythmKick(ac.currentTime+.001); else rhythmClap(ac.currentTime+.001);
    rhythmFlash(rTargetEl(which),'hit',120);
    if (rLive) rLive.taps.push({ t:rhythmTapTime(perfMs), target:which });
  }
  for (const [el,which] of [[rBoomEl,'B'],[rClapEl,'C']]) {
    el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); rhythmTap(which,ev.timeStamp); });
    el.addEventListener('click',ev=>ev.preventDefault());
  }
  // Keys as well as touch: an arrow pair, or Z and M. How an adult checks the
  // section on a laptop, and the path a student on a switch or keyboard takes.
  document.addEventListener('keydown',ev=>{
    if (!rOn || ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k=ev.key.toLowerCase();
    if (k==='arrowleft'||k==='z') { ev.preventDefault(); rhythmTap('B',ev.timeStamp); }
    else if (k==='arrowright'||k==='m'||k==='x') { ev.preventDefault(); rhythmTap('C',ev.timeStamp); }
  });

  // ---- judging -----------------------------------------------------------
  // Pure, so it can be driven without a clock. Each tap belongs to whichever
  // slot it is nearest; the measure passes only if every slot holds exactly
  // what the pattern asked for and nothing else was played.
  function rhythmJudge(slots,taps,start,measureDur) {
    const n=slots.length, slotDur=measureDur/n;
    const got=new Array(n).fill(null);
    let stray=0;
    for (const tap of taps) {
      const i=Math.round((tap.t-start)/slotDur);
      if (i<0 || i>=n || got[i]) { stray++; continue; }
      got[i]=tap.target;
    }
    const want=slots.map(s=>(s==='B'||s==='C') ? s : null);
    const wrong=want.filter((w,i)=>got[i]!==w).length;
    return { pass: wrong===0 && stray===0, wrong, stray, got, want };
  }

  // ---- the script --------------------------------------------------------
  function rhythmSectionAt(measure) {
    for (const s of rSections)
      if (measure>=s.startMeasure && measure<s.startMeasure+s.measures) return s;
    return null;
  }

  // One call-and-response: the band's measure, then the student's. Planned as
  // a pair so the two always sit on adjacent bars of the same grid.
  function rhythmPlanTask() {
    const task=rhythmTask();
    const spm=task.slots.length;
    const slotDur=rhythmMeasureDur()/spm;

    const demo={ kind:'demo', startMeasure:rNextMeasure, measures:1,
                 slots:task.slots, events:[], sent:0 };
    for (let i=0;i<spm;i++)
      demo.events.push({ t:rhythmMeasureTime(rNextMeasure)+i*slotDur, tok:task.slots[i] });
    rSections.push(demo);
    // Lock as the demonstration starts, unlock the instant it ends.
    rCues.push({ t:rhythmMeasureTime(rNextMeasure)-.05, fn:()=>rhythmSetLocked(true) });
    rNextMeasure+=1;

    const startAt=rhythmMeasureTime(rNextMeasure);
    const play={ kind:'play', startMeasure:rNextMeasure, measures:1,
                 slots:task.slots, events:[], sent:0,
                 taps:[], start:startAt, slotDur };
    rSections.push(play);
    rCues.push({ t:startAt-slotDur*RHYTHM_SLOT_SLOP, fn:()=>{
      rLive=play; rhythmSetLocked(false);
    }});
    rNextMeasure+=1;
    // Judged half a slot after the bar ends, so a tap that lands late on the
    // final slot is still inside its own window when the books are closed.
    rCues.push({ t:startAt+rhythmMeasureDur()+slotDur*RHYTHM_SLOT_SLOP,
                 fn:()=>rhythmSettle(play) });
    rBanner(rhythmPatternLabel(task)+'   ·   '+(rTaskIdx+1)+' of '+RHYTHM_PATTERNS.length+
            (rAttempt?'   ·   again':''));
  }

  function rhythmSettle(play) {
    if (rLive!==play) return;
    rLive=null;
    const r=rhythmJudge(play.slots,play.taps,play.start,rhythmMeasureDur());
    if (r.pass) {
      rPassed++;
      rAttempt=0;
      rTaskIdx=(rTaskIdx+1)%RHYTHM_PATTERNS.length;
      const ac=audioCtx;
      if (ac) rhythmChime(ac.currentTime+.02);
    } else {
      rAttempt++;        // same pattern, demonstrated again
    }
  }

  function rhythmPatternLabel(task) {
    return task.slots.map(s=>({B:'BOOM',C:'CLAP','-':'·'})[s]||s).join(' ');
  }

  // ---- the two clocks ----------------------------------------------------
  // Queue the next RHYTHM_SCHEDULE_AHEAD seconds. Called on a timer that is
  // allowed to be late: everything it queues carries an AudioContext time, so
  // jitter here never reaches the beat.
  function rhythmSchedule() {
    const ac=audioCtx;
    if (!rOn || !ac || !rGrid) return;
    const until=ac.currentTime+RHYTHM_SCHEDULE_AHEAD;
    const stepsPerMeasure=RHYTHM_METER*2;     // the backing grid is always eighths
    const atMeasure=Math.floor(rGrid.nextStep/stepsPerMeasure);
    // Never run out of script. A task is two measures, so topping up with
    // three left is always well ahead of the playhead.
    if (rNextMeasure-atMeasure<3) rhythmPlanTask();

    let pushed=false, guard=0;
    while (rGrid.beat0+rGrid.nextStep*rGrid.stepDur<until && guard++<512) {
      const idx=rGrid.nextStep++;
      const t=rGrid.beat0+idx*rGrid.stepDur;
      const pos=idx%stepsPerMeasure;
      // Hats and bass, every measure, under everything - including the
      // student's own. A groove that stopped for their turn would take the
      // pulse with it at exactly the moment they need it most.
      const hat=RHYTHM_HATS[pos % RHYTHM_HATS.length];
      // A touch of velocity wander. Identical hats for minutes on end is the
      // other half of why a synthesised beat reads as a machine.
      const wobble=.88+Math.random()*.24;
      if (hat==='o') rhythmHat(t,{open:true,vol:.8*wobble});
      else rhythmHat(t,{vol:hat*wobble});
      for (const [step,note,len] of RHYTHM_BASSLINE)
        if (pos===step)
          rhythmBass(t,{A:BASS_A,C:BASS_C,G:BASS_G}[note],len*rGrid.beatDur,.9);
      rCues.push({ t, band: pos===0 ? 'downbeat' : (pos%2===0 ? 'beat' : null) });
      pushed=true;
    }
    for (const sec of rSections)
      while (sec.sent<sec.events.length && sec.events[sec.sent].t<until) {
        rhythmSend(sec,sec.events[sec.sent++]);
        pushed=true;
      }
    if (pushed) rCues.sort((a,b)=>a.t-b.t);
    if (rNodes.length>900) rNodes=rNodes.slice(-300);
    // The section list would otherwise grow for as long as the student plays,
    // and rhythmSectionAt() walks it on every eighth note.
    if (rSections.length>16)
      rSections=rSections.filter(sec => sec.sent<sec.events.length ||
                                        sec.startMeasure+sec.measures>=atMeasure-1);
  }

  // Only the DEMO sounds and lights. The student's measure is silent from the
  // band and dark on the targets - no lights during their turn is exactly what
  // makes this simon says rather than follow-the-dot.
  function rhythmSend(sec,e) {
    if (sec.kind!=='demo') return;
    if (e.tok==='B') { rhythmKick(e.t); rCues.push({ t:e.t, cue:'B' }); }
    else if (e.tok==='C') { rhythmClap(e.t); rCues.push({ t:e.t, cue:'C' }); }
  }

  // Fire visuals and callbacks against what is BEING HEARD, so a light lands
  // with its sound rather than with its scheduling.
  function rhythmFrame() {
    if (!rOn) return;
    // Second driver for the scheduler. The interval is the primary one, but a
    // throttled timer must not be able to starve the beat, and this costs an
    // early return on the frames where nothing is due.
    rhythmSchedule();
    const now=rhythmHeardTime();
    while (rCues.length && rCues[0].t<=now) {
      const e=rCues.shift();
      if (e.band) rhythmBandFlash(e.band);
      if (e.cue) rhythmFlash(rTargetEl(e.cue),'cue',170);
      if (e.fn) e.fn();
      if (!rOn) return;              // a callback may have ended the section
    }
    rRaf=requestAnimationFrame(rhythmFrame);
  }

  // ---- start and stop ----------------------------------------------------
  // The brain-break shape: kept working and kept tested, but NOT in the break
  // rotation - see pickBreak(). It differs only in ending itself.
  function startRhythmBreak(onFinish) {
    if (!audio()) { startBrainBreak(onFinish); return; }
    startRhythm('break', onFinish);
  }
  function startRhythmActivity() {
    if (!audio()) return;
    startRhythm('activity', null);
  }
  function startRhythm(runMode,onFinish) {
    const ac=audio(); if (!ac) return;
    rMode=runMode;
    brushOff();
    rOnFinish=onFinish;
    rOn=true;
    rSections=[]; rCues=[]; rNodes=[]; rNextMeasure=0; rLive=null;
    rAttempt=0; rPassed=0;
    rhythmResetTargets();
    rhythmSetLocked(true);
    rBanner('');
    rhythmEl.classList.add('on');
    rhythmEl.setAttribute('aria-hidden','false');

    const beatDur=60/RHYTHM_BPM;
    rGrid={ beat0:ac.currentTime+RHYTHM_LEAD_IN, beatDur, stepDur:beatDur/2, nextStep:0 };
    const bus=rhythmBus();
    if (bus) {
      bus.gain.cancelScheduledValues(ac.currentTime);
      bus.gain.setValueAtTime(RHYTHM_LEVEL,ac.currentTime);
    }
    // One empty measure of groove before the first demonstration, so the
    // student hears the tempo before anything is asked of them.
    rSections.push({ kind:'intro', startMeasure:0, measures:1, events:[], sent:0 });
    rNextMeasure=1;
    rhythmPlanTask();
    // As a brain break it stops after a fixed number of call-and-responses.
    if (rMode==='break')
      rCues.push({ t:rhythmMeasureTime(1+RHYTHM_BREAK_TASKS*2), fn:endRhythm });
    rCues.sort((a,b)=>a.t-b.t);
    rhythmSchedule();
    rSched=setInterval(rhythmSchedule,RHYTHM_SCHEDULE_EVERY);
    rRaf=requestAnimationFrame(rhythmFrame);
  }

  function endRhythm() {
    if (!rOn) return;
    rOn=false;
    clearInterval(rSched); rSched=null;
    cancelAnimationFrame(rRaf); rRaf=0;
    clearTimeout(rBandTimer); rBandTimer=null;
    const ac=audioCtx;
    if (rBus && ac) {
      // Mute the bus BEFORE stopping sources: anything already queued goes
      // silent at once, and the short ramp keeps it from clicking.
      try {
        rBus.gain.cancelScheduledValues(ac.currentTime);
        rBus.gain.setTargetAtTime(0,ac.currentTime,.02);
      } catch {}
    }
    for (const n of rNodes) { try { n.stop(); } catch {} }
    rNodes=[]; rCues=[]; rSections=[]; rGrid=null; rLive=null;
    rhythmResetTargets();
    rBanner('');
    rhythmEl.classList.remove('on');
    rhythmEl.setAttribute('aria-hidden','true');
    const done=rOnFinish; rOnFinish=null;
    if (done) done();
  }

  // A test seam, not a feature. Nothing in the app reads it.
  window.__rhythm = {
    patterns:RHYTHM_PATTERNS, judge:rhythmJudge,
    state:()=>({ on:rOn, mode:rMode, locked:rLocked, task:rTaskIdx,
                 attempt:rAttempt, passed:rPassed, live:Boolean(rLive),
                 measuresPlanned:rNextMeasure, sections:rSections.length }),
    now:rhythmHeardTime,
    live:()=>rLive && { slots:rLive.slots, start:rLive.start, slotDur:rLive.slotDur },
    tap:(w)=>rhythmTap(w,performance.now()),
    end:endRhythm
  };

  // ----------------------------------------------------------- progression ---
  let itemsDone=0, tasksDone=0;
  // Bumped whenever the session changes (menu pick, or a trip home). Pending
  // timers captured an older value and silently do nothing, so a word that was
  // mid-advance cannot reach through and set up an item behind the menu.
  let runId=0;

  // How many completed items earn a reward round, per mode. A CVC word is three
  // cells of work, so it earns one twice as often as a single letter does.
  const MINIGAME_EVERY = { letters:4, numbers:4, cvc:2, sight:2 };

  // How many completed TASKS earn a brain break. A task is any finished piece
  // of work, and a reward round counts as one of them - so the break is paced
  // off everything the student does, not off letters alone.
  // Was 4 until 2026-10-14. At 4 the break landed roughly every third word in
  // the modes that reward every second item, which read as too often in use.
  const BRAIN_BREAK_EVERY = 6;

  function taskDone(then) {
    tasksDone++;
    if (tasksDone%BRAIN_BREAK_EVERY===0) pickBreak(then); else then();
  }
  // ------------------------------------------------------ which break runs ---
  // taskDone() above owns WHEN a break happens, and that stays its decision.
  // This owns only WHICH activity fills it.
  //
  // Rhythm is NOT in the rotation. It was built as a break, then promoted to
  // its own menu section so it can be developed as a thing you practise rather
  // than a thing that interrupts you. The break form still works and is still
  // tested - put 'rhythm' back in this array to use it, once the activity has
  // been dialled in by ear. ?break=rhythm pins it for a session without
  // editing anything.
  let breakRotation=['carl'];
  let breakTurn=0;
  function pickBreak(then) {
    const kind=breakRotation[breakTurn++ % breakRotation.length];
    if (kind==='rhythm') startRhythmBreak(then); else startBrainBreak(then);
  }


  // There used to be a SIGHT_THINK_MS = 5000 pause here: round 2 asked the
  // question and then answered itself after five seconds of silence. The ask
  // now happens when the card is presented and the braille dots are the
  // answer, so the student sets the pace and the timer is gone. The rule it
  // was written under still stands for everything else in this chain: wait on
  // the clip before you, never on a fixed timer, because a fixed timer cut
  // the CVC blend off part-way through once already.

  // True while a prompt is speaking and the dots must not accept input yet.
  // Set only by the round-2 ask; cleared when that clip ends, when the clip
  // fails, and on every runId change (menu trip) so it can never stick.
  let inputLocked=false;
  function setInputLocked(v) {
    inputLocked=v;
    document.body.classList.toggle('asking',v);
  }

  function sightReveal(myRun,done) {
    const alive=()=>myRun===runId;
    const sayWord=()=>{ if (alive()) playClip(sightSrc(word),done); };
    // Round 1: the spelling, a beat, then the word - the same shape the CVC
    // blend has, so it lands as "t... h... e... THE" rather than running
    // the letters straight into the word.
    if (sightRound===1) { setTimeout(sayWord,700); return; }
    // Round 2: the question was asked when the card came up, and the dots ARE
    // the answer - so once they are in, confirm immediately. Same 700 ms beat
    // as round 1 so the two rounds feel alike.
    setTimeout(()=>{ if (alive()) playClip(SIGHT_REVEAL,sayWord); },700);
  }

  function checkCompletion() {
    if (advancing || !traceDone) return;
    if (!cells.length || !cells.every(c=>c.done)) return;
    advancing=true;
    brushOff();

    const myRun=runId;
    const advance=()=>{
      if (myRun!==runId) return;
      orderIndex++;
      if (orderIndex>=order.length) {
        // Round 2 starts once round 1 has used the whole list, then hands back
        // to round 1: the section cycles rather than ending.
        if (mode==='sight') sightRound = sightRound===1 ? 2 : 1;
        buildOrder();
      }
      itemsDone++;
      // Three links, each waiting on the one before: break, reward round, next
      // item. Both rewards can legitimately fall on the same item, and every
      // link re-checks runId because a trip to the menu must cut the chain.
      const resume=()=>{ if (myRun!==runId) return; setupItem(); advancing=false; };
      const afterGame=()=>{ if (myRun!==runId) return; taskDone(resume); };
      const afterBreak=()=>{
        if (myRun!==runId) return;
        if (itemsDone%MINIGAME_EVERY[mode]===0) startMinigame(afterGame); else resume();
      };
      taskDone(afterBreak);
    };
    const flashAndAdvance=()=>{
      if (myRun!==runId) return;
      success.animate([{opacity:0},{opacity:.30},{opacity:0}],{duration:430,easing:'ease-out'});
      setTimeout(advance,500);
    };

    // The whole word is the payoff for blending three sounds, so it is spoken
    // BEFORE the screen moves on - the flash waits for the voice to finish.
    // A deliberate beat between the final consonant and the whole word, so the
    // blend lands as "n... u... t... NUT" rather than running together.
    if (mode==='sight') { sightReveal(myRun,flashAndAdvance); return; }
    if (mode==='cvc') { setTimeout(()=>playClip(wordSrc(word),flashAndAdvance),700); return; }
    if (mode==='numbers') { setTimeout(()=>playClip(numberSrc(glyph),flashAndAdvance),200); return; }
    flashAndAdvance();
  }

  // Browser prototype: double-tap the tiny button. The APK can later use true immersive/kiosk-like behavior.
  let lastExitTap=0;
  exitBtn.addEventListener('pointerup',ev=>{
    ev.preventDefault();
    const now=performance.now();
    if (now-lastExitTap<650) {
      try { document.exitFullscreen?.(); } catch {}
      exitMessage.style.display='grid';
    }
    lastExitTap=now;
  });

  const fullscreenBtn=document.getElementById('fullscreen');
  const fullscreenStatus=document.getElementById('fullscreenStatus');
  const isFullscreen=()=>Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  fullscreenBtn.addEventListener('click',async()=>{
    fullscreenStatus.textContent='';
    try {
      if (isFullscreen()) {
        const leave=document.exitFullscreen || document.webkitExitFullscreen;
        if (leave) await leave.call(document);
      } else {
        const enter=document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (!enter) throw new Error('unavailable');
        await enter.call(document.documentElement);
      }
    } catch {
      fullscreenStatus.textContent='Full screen is unavailable here. Open this file directly in your browser and try again.';
    }
  });
  function fullscreenChanged() {
    fullscreenBtn.textContent=isFullscreen() ? '⛶ Exit full screen' : '⛶ Full screen';
    requestAnimationFrame(resizeCanvas);
  }
  document.addEventListener('fullscreenchange',fullscreenChanged);
  document.addEventListener('webkitfullscreenchange',fullscreenChanged);
  window.addEventListener('resize',resizeCanvas);
  window.visualViewport?.addEventListener('resize',resizeCanvas);
  new ResizeObserver(resizeCanvas).observe(document.getElementById('traceWrap'));
  window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,120));

  // ---------------------------------------------------------- tap to start ---
  // Browsers refuse to start audio without a user gesture, so without this gate
  // the first dot or stroke of a session would be silent and read as broken.
  // The splash absorbs that unlocking touch and answers with a rising C-E-G,
  // which doubles as proof to the adult in the room that sound is working.
  const splash=document.getElementById('splash');
  let splashDone=false;
  function dismissSplash() {
    if (splashDone) return;
    splashDone=true;
    splash.style.pointerEvents='none'; // before the fade, so it can't eat a second touch
    const chime=()=>{
      playTone(523.25,{dur:.5,vol:.26});
      playTone(659.26,{dur:.5,vol:.26,delay:.11});
      playTone(783.99,{dur:.8,vol:.3,delay:.22});
    };
    const ac=audio();
    // resume() settles after the context is really running; chime either way.
    if (ac && ac.state!=='running') ac.resume().then(chime,chime); else chime();
    // Put the menu up BEFORE the splash fades, not after it.
    //
    // A letters card is set up at load so that something is rendered behind
    // the splash. Handing over only once the fade had finished meant those
    // 280 ms showed the letters activity through the fading splash - a blink
    // of a tracing guide and a braille cell before the menu appeared. The
    // menu is opaque and sits at z-index 70, under the splash's 80, so
    // opening it now simply means the fade reveals the right screen instead
    // of the wrong one.
    afterSplash();
    // fill:'forwards' is load-bearing. Without it the animation reverts to the
    // base style when it ends, so if `finished` is slow to settle - which it is
    // whenever rAF is throttled, e.g. the tab was backgrounded - the splash
    // springs back to full opacity over the letter. It stays click-through, so
    // the failure is purely visual, which on a tablet is the worst kind.
    const fade=splash.animate([{opacity:1},{opacity:0}],
                              {duration:280,easing:'ease-out',fill:'forwards'});
    // afterSplash() has already run; this only takes the dead layer away.
    const hide=()=>{ splash.classList.add('gone'); };
    fade.finished.then(hide,hide);
    setTimeout(hide,400); // belt and braces if `finished` never settles at all
  }
  splash.addEventListener('pointerdown',ev=>{ ev.preventDefault(); dismissSplash(); });
  splash.addEventListener('keydown',ev=>{
    if (ev.key===' '||ev.key==='Enter') { ev.preventDefault(); dismissSplash(); }
  });

  // ------------------------------------------------------------- chooser ---
  // The teacher picks the activity once, at the start of the session. There is
  // deliberately NO mode button on the activity screen: a student would hit it,
  // and would hit it in the middle of a word.
  const chooser=document.getElementById('chooser');
  const vowelPanel=document.getElementById('chooserVowels');
  const vowelRow=vowelPanel.querySelector('.chooserRow');
  const sightPanel=document.getElementById('chooserSight');

  // Every letter sample in the menu is drawn, not typed. See glyphWord().
  function fillSample(card,text,slot='b') {
    const svg=glyphWord(text);
    if (!svg) return;
    const host=card.querySelector(slot);
    host.textContent='';
    host.appendChild(svg);
  }

  for (const v of VOWEL_ORDER) {
    const b=document.createElement('button');
    b.type='button'; b.className='card vowel';
    b.innerHTML='<b></b><span class="sampleWord"></span>';
    fillSample(b,v);
    // The example word carries an `a` in "cat", so it is drawn as well.
    fillSample(b,CVC_WORDS[v][0],'span');
    b.addEventListener('click',()=>start('cvc',v));
    vowelRow.appendChild(b);
  }
  const mix=document.createElement('button');
  mix.type='button'; mix.className='card vowel';
  mix.innerHTML='<b></b><span>Mix them</span>';
  fillSample(mix,'a i o e u');
  mix.addEventListener('click',()=>start('cvc',null));
  vowelRow.appendChild(mix);

  for (const card of document.querySelectorAll('#chooser .card[data-sample]'))
    fillSample(card,card.dataset.sample);

  for (const b of sightPanel.querySelectorAll('.card')) {
    b.addEventListener('click',()=>start('sight',null,b.dataset.convention));
  }

  for (const card of document.querySelectorAll('#chooserModes .card')) {
    card.addEventListener('click',()=>{
      const picked=card.dataset.mode;
      // Only one follow-up panel at a time: tapping Words then Sight words
      // must not leave both sets of choices on screen.
      vowelPanel.hidden=true; sightPanel.hidden=true;
      if (picked==='cvc') { vowelPanel.hidden=false; return; }
      if (picked==='sight') { sightPanel.hidden=false; return; }
      start(picked,null);
    });
  }

  function start(picked,vowel,convention) {
    runId++;
    setInputLocked(false);
    mode=picked; cvcVowel=vowel;
    sightConvention = convention==='ueb' ? 'ueb' : 'grapheme';
    sightRound=1;
    document.body.classList.remove('mode-letters','mode-cvc','mode-numbers',
                                   'mode-sight','mode-rhythm','round2');
    document.body.classList.add('mode-'+mode);
    chooser.classList.remove('on');
    homeBtn.hidden=false;
    itemsDone=0; tasksDone=0;
    // Rhythm has no items, no order and nothing to trace or answer in braille.
    // It owns the screen until the ⌂ takes it back, so it skips the whole
    // item pipeline rather than setting up a letter nobody will ever see.
    if (mode==='rhythm') {
      boxesEl.textContent=''; sightWordEl.textContent=''; brailleEl.textContent='';
      cells=[]; order=[]; word=null; glyph=null; traceDone=true;
      startRhythmActivity();
      return;
    }
    buildOrder();
    setupItem();
    resizeCanvas();
  }

  function openChooser() {
    chooser.classList.add('on');
    homeBtn.hidden=true;
  }

  // Back to the activity menu. Top-left, tiny, dull, and double-tap only - the
  // same shape as the exit button, for the same reason: it is for the adult in
  // the room, and the student must not be able to find it by flailing at the screen.
  const homeBtn=document.getElementById('home');
  let lastHomeTap=0, homeArmTimer=null;
  function disarmHome() {
    clearTimeout(homeArmTimer); homeArmTimer=null;
    lastHomeTap=0; homeBtn.classList.remove('armed');
  }
  homeBtn.addEventListener('pointerup',ev=>{
    ev.preventDefault();
    const now=performance.now();
    if (now-lastHomeTap<650) { disarmHome(); goHome(); return; }
    lastHomeTap=now;
    homeBtn.classList.add('armed');
    clearTimeout(homeArmTimer);
    homeArmTimer=setTimeout(disarmHome,650);
  });

  function goHome() {
    disarmHome();
    runId++;
    setInputLocked(false);
    advancing=false;
    brushOff();
    stopDrawing();
    if (currentClip) { try { currentClip.pause(); } catch {} }
    // Drop the reward round's continuation before tearing it down, or finishing
    // it would advance the activity we are walking away from.
    if (minigameActive()) { mgOnFinish=null; endMinigame(); }
    if (brainBreakActive()) { bbOnFinish=null; endBrainBreak(); }
    if (rhythmActive()) { rOnFinish=null; endRhythm(); }
    vowelPanel.hidden=true;
    sightPanel.hidden=true;
    openChooser();
  }

  // A teacher can bookmark straight past the menu: ?mode=cvc&vowel=i
  const params=new URLSearchParams(location.search);
  const wanted=(params.get('mode')||'').toLowerCase();
  const wantedVowel=(params.get('vowel')||'').toLowerCase();
  const presetMode=({letters:'letters',words:'cvc',cvc:'cvc',numbers:'numbers',
                     sight:'sight',sightwords:'sight',rhythm:'rhythm',beat:'rhythm'})[wanted]
                   || (params.get('letter') ? 'letters' : null);
  const wantedBraille=(params.get('braille')||'').toLowerCase();

  // Which break activity the session uses. Default is both, alternating, with
  // Carl first; ?break=carl or ?break=rhythm pins it to one.
  const wantedBreak=(params.get('break')||'').toLowerCase();
  if (wantedBreak==='carl'||wantedBreak==='rhythm') breakRotation=[wantedBreak];
  // Start the rhythm section partway down the pattern list, for hearing a
  // harder one without playing up to it. 1-based, as the banner counts.
  const wantedTask=parseInt(params.get('rtask'),10);
  if (Number.isFinite(wantedTask))
    rTaskIdx=Math.max(0,Math.min(RHYTHM_PATTERNS.length-1,wantedTask-1));
  // ?rhythm=1 previews the BRAIN-BREAK shape - one set, then it hands back to
  // the menu by itself. The activity shape is ?mode=rhythm, or the Rhythm card.
  const rhythmPreview=params.get('rhythm')==='1';

  // Something must be rendered behind the splash, so letters is set up now and
  // simply replaced if the teacher picks differently.
  start('letters',null);

  let handedOver=false;
  function afterSplash() {
    if (handedOver) return;
    handedOver=true;
    // 1.8MB, and its duration is what the dance is timed to - fetch it now,
    // long before it is needed. preload alone is a hint; load() is not.
    try { clip(BRAIN_BREAK_SRC).load(); } catch {}
    // The rhythm section used to warm a set of spoken lines here. It has no
    // speech at all now - the groove, the lights and the lock carry it - so
    // there is nothing to preload. audio/rhythm/ is kept on disk but unused;
    // see the note in README.
    if (rhythmPreview) { startRhythmBreak(openChooser); return; }
    if (presetMode) start(presetMode, CVC_WORDS[wantedVowel] ? wantedVowel : null,
                          wantedBraille);
    else openChooser();
  }
})();
</script>
</body>
</html>
