<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Trace + Braille Alphabet</title>
<style>
  :root { --bg:#000; --letter:#ff453a; --trace:#30d158; --inactive:#505050; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); overscroll-behavior:none; }
  body { font-family:Arial,Helvetica,sans-serif; touch-action:none; }
  #app {
    position:fixed; inset:0; width:100vw; height:100dvh; overflow:hidden; background:var(--bg);
    display:grid; grid-template-rows:minmax(0, 73fr) minmax(0, 27fr);
  }
  #traceWrap { position:relative; min-width:0; min-height:0; overflow:hidden; }
  #traceCanvas { display:block; width:100%; height:100%; touch-action:none; }
  #braille {
    min-height:0; display:flex; align-items:center; justify-content:center;
    gap:clamp(34px,9vw,78px); padding:0 5vw max(1vh,8px); touch-action:none;
  }
  .brailleCol { display:flex; flex-direction:column; gap:clamp(12px,2vh,22px); }
  .dot {
    width:clamp(54px,15vw,108px); aspect-ratio:1; border-radius:50%;
    border:clamp(5px,1.5vw,12px) solid var(--inactive); background:#090909;
    transition:transform .08s ease, background .08s ease, border-color .08s ease;
    touch-action:none;
  }
  .dot.required { border-color:var(--letter); background:#090909; }
  .dot.hit { border-color:var(--trace); background:var(--trace); transform:scale(1.08); }
  #fullscreen {
    position:absolute; z-index:20; left:max(12px,env(safe-area-inset-left));
    bottom:max(12px,env(safe-area-inset-bottom)); min-height:44px;
    padding:10px 14px; border:1px solid #888; border-radius:8px;
    background:#171717; color:#eee; font:600 15px Arial,sans-serif;
    touch-action:none;
  }
  #fullscreenStatus { position:absolute; bottom:64px; left:12px; max-width:300px;
    color:white; background:#000; font:14px Arial,sans-serif; z-index:20; }
  /* Findable by the adult in the room, still not a target for the student. The old
     was 24x20 of #555 on #121212 at 48% opacity - black on black at arm's
     length, and could not be found at all. It is legible grey on a bordered
     pill now, but still small, still jammed in the corner, and still double-tap,
     which is the part that actually stops a stray palm from leaving the
     activity. The exit X below stays dim ON PURPOSE: going back to the menu is
     routine, quitting the app is not. */
  #home {
    position:absolute; z-index:60; top:max(3px,env(safe-area-inset-top)); left:3px;
    width:40px; height:32px; padding:0;
    border:1px solid #4a4a4a; border-radius:6px;
    background:#1c1c1c; color:#b4b4b4; font:bold 18px/30px Arial,sans-serif;
    touch-action:none;
    transition:background .12s linear, color .12s linear, border-color .12s linear;
  }
  /* The first tap of the pair lights it up, so an adult who taps once can see
     that it registered and that a second tap is wanted. Without this the
     double-tap is indistinguishable from a dead button. */
  #home.armed { background:#3f3f3f; color:#fff; border-color:#8f8f8f; }
  #home[hidden] { display:none; }
  #exit {
    position:absolute; z-index:60; top:max(3px,env(safe-area-inset-top)); right:3px;
    width:24px; height:20px; padding:0; border:0; border-radius:4px;
    background:#121212; color:#555; opacity:.48; font:bold 10px/20px Arial,sans-serif;
    touch-action:none;
  }
  #success { position:absolute; inset:0; z-index:12; pointer-events:none; background:white; opacity:0; }
  /* Carl's height. Both terms are 1.3x the originals (60vh / 78vw) - owner asked
     for 30% bigger on 2026-10-11. The vw term governs in portrait, the vh term
     in landscape. */
  :root { --carlH: min(78vh, 101.4vw); }
  #exitMessage {
    display:none; position:absolute; inset:0; z-index:70; place-items:center;
    background:#000; color:#fff; font:700 clamp(28px,8vw,70px)/1 Arial,sans-serif;
  }
  /* Minigame: one shape at a time, left to right. Opaque so it absorbs every
     stray touch meant for the canvas or the braille cell underneath. */
  #minigame { display:none; position:absolute; inset:0; z-index:30; background:#000; touch-action:none; }
  #minigame.on { display:block; }
  .mgShape {
    position:absolute; transform:translate(-50%,-50%);
    display:block; touch-action:none; will-change:transform,opacity;
  }
  .mgShape svg { display:block; width:100%; height:100%; overflow:visible; }
  /* Brain break: Carl dances across the screen to his own music. Nothing to
     tap, nothing to get right - it is a rest, so the layer is inert. It sits
     above the reward round but BELOW the home and exit buttons (z 60), so the
     adult in the room can always walk out of it. */
  #brainbreak { display:none; position:absolute; inset:0; z-index:50; background:#fff; touch-action:none; }
  #brainbreak.on { display:block; }
  /* Travel and hop are two animations on two elements. Splitting them keeps
     the crossing perfectly linear while Carl bounces, and it means the
     keyframes stay short enough to read. */
  #carl {
    position:absolute; left:0; top:50%; height:var(--carlH);
    margin-top:calc(var(--carlH) / -2);
    animation:carlCross var(--bbDur,10.2s) linear forwards;
    will-change:transform;
  }
  #carl img {
    display:block; height:100%; width:auto;
    /* Two shadows, both dark, on a white background (changed 2026-10-11). The
       transit is TRACKING practice, so the whole silhouette has to read as one
       moving shape. Measured, 48.9% of Carl's pixels are near-black and ~30%
       are near-white: on the old black background the dark half vanished, and
       on white the light third would. The tight 2px shadow is the edge that
       keeps his light parts visible against #fff; the wide soft one is the
       halo the white glow used to give. Don't drop the tight one - it is the
       one doing the work. */
    filter:drop-shadow(0 0 2px rgba(0,0,0,.9))
           drop-shadow(0 0 clamp(6px,1.4vh,16px) rgba(0,0,0,.45));
    animation:carlHop .46s ease-in-out infinite;
    will-change:transform;
  }
  /* -100% is Carl's own width, so he starts fully off the left edge whatever
     size he is; 100vw puts his left edge past the right one. */
  @keyframes carlCross {
    from { transform:translateX(-100%); }
    to   { transform:translateX(100vw); }
  }
  @keyframes carlHop {
    0%,100% { transform:translateY(0) rotate(-6deg) scaleY(.97); }
    50%     { transform:translateY(calc(var(--carlH) * -.17)) rotate(6deg) scaleY(1.03); }
  }
  /* Tap-to-start gate. Covers everything so the first touch of a session lands
     here and nowhere else, whichever part of the screen the student reaches for. */
  #splash {
    position:absolute; inset:0; z-index:80; background:#000;
    display:grid; place-items:center; touch-action:none;
  }
  #splash.gone { display:none; }
  #splashInner { display:flex; flex-direction:column; align-items:center; gap:clamp(18px,5vh,46px); }
  #splashDot {
    width:clamp(110px,24vh,240px); aspect-ratio:1; border-radius:50%;
    background:#ffd60a; box-shadow:0 0 0 clamp(7px,1.5vh,15px) #fff;
    animation:splashPulse 1.6s ease-in-out infinite;
  }
  #splashText { color:#fff; font:700 clamp(26px,7vh,62px)/1 Arial,sans-serif; }
  @keyframes splashPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.11); } }
  @media (prefers-reduced-motion:reduce) { #splashDot { animation:none; } }
  @media (orientation:landscape) {
    #app { grid-template-columns:minmax(0,76fr) minmax(0,24fr); grid-template-rows:100%; }
    #traceWrap { grid-column:1; grid-row:1; }
    #braille { grid-column:2; grid-row:1; padding:4vh 1vw 3vh; gap:clamp(22px,3vw,48px); }
    .brailleCol { gap:clamp(10px,3vh,24px); }
    .dot { width:clamp(48px,11vh,94px); border-width:clamp(5px,1.35vh,11px); }
  }
  /* A braille cell. In CVC and numbers a word is several cells in sequence:
     only the foregrounded one is live, the rest are dimmed and inert, so the
     ORDER of the cells is itself part of what is being taught. */
  #braille.cells-2 .cell, #braille.cells-3 .cell,
  #braille.cells-4 .cell { transform:scale(.6); opacity:.32; }
  #braille .cell {
    display:flex; gap:clamp(22px,5.5vw,56px);
    transition:transform .22s ease, opacity .22s ease;
    transform-origin:center;
  }
  #braille.cells-2 .cell.active, #braille.cells-3 .cell.active,
  #braille.cells-4 .cell.active { transform:scale(1); opacity:1; }
  #braille .cell.done { opacity:.3; }
  #braille.cells-2 .cell.done, #braille.cells-3 .cell.done,
  #braille.cells-4 .cell.done { transform:scale(.62); opacity:.3; }
  #braille.cells-2, #braille.cells-3 { gap:clamp(10px,2.2vw,30px); }
  #braille.cells-4 { gap:clamp(8px,1.8vw,24px); }
  #braille.cells-2 .dot { width:clamp(44px,11vw,96px); border-width:clamp(5px,1.3vw,11px); }
  #braille.cells-3 .dot { width:clamp(38px,9.4vw,84px); border-width:clamp(4px,1.1vw,10px); }
  #braille.cells-4 .dot { width:clamp(32px,8vw,72px); border-width:clamp(4px,1vw,9px); }
  #braille.cells-2 .brailleCol, #braille.cells-3 .brailleCol,
  #braille.cells-4 .brailleCol { gap:clamp(8px,1.5vh,16px); }
  /* The print letters of a CVC word. No tracing here - the student reads these and
     answers them in braille, so the box only ever reports progress. */
  /* One absolute size drives both the box and the letter inside it. A
     percentage height on the <svg> does NOT resolve here - the box's
     aspect-ratio leaves its height indefinite for descendants, so the letter
     falls back to its own intrinsic ratio and ascenders spill out the bottom.
     The vh term keeps the boxes inside their row on a short landscape screen. */
  #boxes {
    --boxSize:clamp(56px,min(20vw,26vh),200px);
    display:none; align-items:center; justify-content:center;
    gap:clamp(12px,3vw,34px); min-height:0; touch-action:none;
  }
  body.mode-cvc #boxes { display:flex; }
  .box {
    display:grid; place-items:center; border-radius:clamp(10px,2vw,20px);
    width:var(--boxSize); height:var(--boxSize);
    border:clamp(4px,1vw,9px) solid #3a3a3a; background:#0b0b0b; color:#6a6a6a;
    transition:transform .22s ease, opacity .22s ease, color .22s ease,
               border-color .22s ease, background .22s ease;
    touch-action:none;
  }
  .box svg { height:calc(var(--boxSize)*.62); width:auto;
             max-width:calc(var(--boxSize)*.78); display:block; overflow:visible; }
  .box svg path { fill:none; stroke:currentColor; stroke-width:10;
                  stroke-linecap:round; stroke-linejoin:round; }
  .box.active { border-color:var(--letter); color:var(--letter); transform:scale(1.14); background:#140707; }
  .box.done { border-color:var(--trace); color:#04210d; background:var(--trace); transform:scale(1); }
  /* Teacher's menu. Big targets, high contrast, and it only appears once per
     session - there is no mode button on the activity screen to hit. */
  /* The menu asks for a single-story `a` - the school-print form, the one the
     tracing guide teaches and the one Arial does not have.
     EVERY LETTER SAMPLE on a card is drawn from PATHS instead of typed, so
     those are guaranteed whatever the tablet has installed (see glyphWord()).
     This stack is only for the surrounding PROSE - "Which braille?", "UEB
     contractions" - which cannot be drawn, because PATHS has no uppercase, no
     space and no question mark.
     ⚠️ It is BEST EFFORT and may silently do nothing. Whether any of these
     families exists is a property of the device: Andika (SIL's literacy face,
     built for exactly this) is installed on the dev box, Futura is the one
     likely to resolve on an iPad, Century Gothic on Windows, URW Gothic on
     Linux. If none do, the fallback is a double-story `a` in those two
     strings and nothing warns you. Do not extend this approach to anything a
     STUDENT reads - draw those.
     If the two strings ever need to be GUARANTEED, Andika is OFL-licensed and
     could be bundled as a @font-face with a relative path, which would still
     work off a USB stick. That is a new binary asset, so it has not been done
     on spec. */
  #chooser {
    position:absolute; inset:0; z-index:70; background:#000;
    display:none; place-items:center; padding:3vh 3vw; touch-action:none;
    font-family:'Andika','Century Gothic','URW Gothic','Futura','Futura-Medium',
                Arial,Helvetica,sans-serif;
  }
  #chooser .card, #chooser .chooserLabel { font-family:inherit; }
  #chooser.on { display:grid; }
  #chooserInner { display:flex; flex-direction:column; gap:clamp(18px,4vh,40px); align-items:center; }
  .chooserRow { display:flex; gap:clamp(12px,3vw,34px); flex-wrap:wrap; justify-content:center; }
  /* The UA sheet's [hidden] rule loses to .chooserRow's display:flex. */
  #chooser [hidden] { display:none; }
  .chooserLabel { color:#8e8e8e; font:600 clamp(15px,3.4vh,26px)/1 Arial,sans-serif; text-align:center; margin-bottom:12px; }
  #chooserVowels, #chooserSight { flex-direction:column; }
  .card {
    min-width:clamp(118px,24vw,230px); padding:clamp(14px,3vh,30px) clamp(10px,2vw,22px);
    border:4px solid #4a4a4a; border-radius:16px; background:#111; color:#fff;
    display:flex; flex-direction:column; gap:10px; align-items:center;
    font-family:Arial,sans-serif; touch-action:none;
  }
  .card b { font-size:clamp(30px,7vh,62px); line-height:1; color:#ffd60a; font-weight:700; }
  /* The letter samples are SVG drawn from PATHS, not text - see glyphWord().
     currentColor carries the card's own colour down to the strokes, so the
     yellow/green rules below still govern. */
  .card b svg, .card span svg { display:block; width:auto; overflow:visible; }
  .card b svg { height:clamp(26px,6vh,54px); max-width:min(42vw,210px); }
  .card span svg { height:clamp(13px,2.4vh,21px); max-width:min(30vw,150px); }
  /* 13, not the 10 the tracing guide and the CVC boxes use. Those are drawn
     large; these are menu-sized, and at this scale a 10-unit stroke came out
     noticeably lighter than the bold text it replaced - which is a contrast
     regression on a menu an adult reads at arm's length. */
  .card b svg path, .card span svg path {
    fill:none; stroke:currentColor; stroke-width:13;
    stroke-linecap:round; stroke-linejoin:round;
  }
  /* ●■ are symbols, not letters, so no glyph table applies and the font is
     not making a claim about letterforms. */
  .card b.sym { letter-spacing:.1em; }
  .card span { font-size:clamp(14px,2.8vh,24px); color:#cfcfcf; text-align:center; }
  .card span.sampleWord { color:#8e8e8e; }
  /* "under construction" on the Rhythm card. Amber rather than grey because
     it is a warning to the adult, not a caption, and it has to survive being
     read at arm's length by someone with low vision. */
  .card em {
    font-style:normal; font-size:clamp(11px,2vh,17px); line-height:1.1;
    color:#ff9f0a; letter-spacing:.03em; text-align:center;
  }
  .card.vowel { min-width:clamp(78px,13vw,130px); }
  .card.vowel b { color:#30d158; }
  .card.sightOpt b { color:#30d158; font-size:clamp(24px,5.5vh,48px); letter-spacing:.02em; }
  .card.sightOpt b svg { height:clamp(22px,5vh,44px); }
  /* CVC has no canvas: print boxes on top, the three cells underneath. */
  body.mode-cvc #traceWrap { display:none; }
  body.mode-cvc #app { grid-template-rows:minmax(0,34fr) minmax(0,66fr); grid-template-columns:100%; }
  body.mode-cvc #boxes { grid-row:1; grid-column:1; }
  body.mode-cvc #braille { grid-row:2; grid-column:1; padding:0 3vw max(1vh,8px); }
  /* The sight word in print. ONE svg for the whole word, deliberately NOT
     the CVC letter boxes: a box costs a border and a gap per letter, and the
     brief for this section is that the lettering is as big as the screen
     allows. So the word is laid out once in glyph space and scaled to fit
     whatever room the row has - a one-letter word fills the band, a
     four-letter word fits across it. The print row and the braille row are
     separate grid tracks, so neither can push the other off screen. */
  #sightWord {
    display:none; grid-row:1; grid-column:1; min-width:0; min-height:0;
    align-items:center; justify-content:center; padding:1.5vh 2vw; overflow:hidden;
  }
  body.mode-sight:not(.round2) #sightWord { display:flex; }
  #sightWord svg { width:100%; height:100%; display:block; overflow:visible; }
  #sightWord svg path { fill:none; stroke:currentColor; stroke-width:10;
                        stroke-linecap:round; stroke-linejoin:round; }
  /* Plain near-white is the maximum-contrast default; the letter colour marks
     the one being answered and green marks the ones finished, which is the
     same vocabulary the CVC boxes use. Set on the <g> so currentColor carries
     it to every path of that letter. */
  #sightWord svg g { color:#e8e8e8; transition:color .2s linear; }
  #sightWord svg g.active { color:var(--letter); }
  #sightWord svg g.done { color:var(--trace); }
  body.mode-sight #traceWrap { display:none; }
  body.mode-sight #app {
    grid-template-columns:100%; grid-template-rows:minmax(0,52fr) minmax(0,48fr);
  }
  body.mode-sight #braille { grid-row:2; grid-column:1; padding:0 3vw max(1vh,8px); }
  /* Round 2 is dots and nothing else, so they get the whole screen. "Bigger"
     is the point of round 2, not a side effect: with no print to read, the
     cell is the only thing on the display. */
  body.mode-sight.round2 #app { grid-template-rows:100%; }
  /* While the round-2 question is still speaking the dots are genuinely inert
     (the JS gate is the authority; this blocks the pointer too). A low-vision
     student tapping a control that silently does nothing has no way to tell
     "not yet" from "broken", so the cells also recede slightly -- the same
     language the inactive-cell styling already uses. The container opacity is
     enough on its own -- the active cell is marked with transform/opacity, not
     a shadow, so there is nothing else to neutralise. */
  body.asking #braille { opacity:.45; pointer-events:none; transition:opacity .18s ease; }
  body.mode-sight.round2 #braille { grid-row:1; grid-column:1; padding:2vh 3vw; }
  /* Sight-word dots are sized off the space they actually have rather than off
     the shared cells-N ceilings, because this section's two rounds give the
     braille row very different amounts of it. Three terms, one per way the row
     can run out of room, and min() takes whichever binds first:
       - a hard cap, so a desktop does not get absurd;
       - a vw term for the width, which is the SAME in both rounds because the
         row is full-width either way;
       - a vh term for the height, which is where the rounds differ: round 1
         leaves the braille 48% of the screen, round 2 gives it all of it.
     Two things here were got wrong by arithmetic and corrected by measuring,
     so measure rather than re-derive:
       - a backgrounded cell is scaled with a TRANSFORM, which does not shrink
         the width it occupies, so a four-cell word costs four FULL-width cells
         however small three of them look;
       - the binding case is a phone in landscape, where the screen is short
         and three stacked dots overflow long before the width does. */
  body.mode-sight #braille.cells-1 { --d:min(108px,34vw,13vh); }
  body.mode-sight #braille.cells-2 { --d:min( 96px,19vw,13vh); }
  body.mode-sight #braille.cells-3 { --d:min( 84px,12vw,13vh); }
  body.mode-sight #braille.cells-4 { --d:min( 72px,8.5vw,13vh); }
  body.mode-sight.round2 #braille.cells-1 { --d:min(210px,34vw,28vh); }
  body.mode-sight.round2 #braille.cells-2 { --d:min(190px,19vw,28vh); }
  body.mode-sight.round2 #braille.cells-3 { --d:min(130px,12vw,28vh); }
  body.mode-sight.round2 #braille.cells-4 { --d:min(110px,8.5vw,28vh); }
  /* #braille is in the selector to outrank `#braille.cells-N .dot` above:
     an id beats any number of classes. */
  body.mode-sight #braille .dot { width:var(--d); border-width:calc(var(--d)/9); }
  /* A braille digit is two cells, which does not fit the one-cell column. */
  body.mode-numbers #app { grid-template-rows:minmax(0,62fr) minmax(0,38fr); }
  @media (orientation:landscape) {
    body.mode-numbers #app { grid-template-columns:minmax(0,58fr) minmax(0,42fr); grid-template-rows:100%; }
  }
  #braille.cells-2 .cell, #braille.cells-3 .cell,
  #braille.cells-4 .cell { gap:clamp(14px,3.4vw,34px); }
  /* The Rhythm section owns the whole screen. The layer below is opaque and
     covers everything anyway, but there is no reason to lay out and paint a
     canvas, a print row and six braille dots nobody will ever see. */
  body.mode-rhythm #traceWrap, body.mode-rhythm #braille,
  body.mode-rhythm #boxes, body.mode-rhythm #sightWord { display:none; }
  /* The two shapes, previewed in the menu card. */
  .card[data-mode="rhythm"] b { letter-spacing:.08em; }

  /* -------------------------------------------------------- rhythm section ---
     Its own activity, picked from the menu. It can also run as a brain break
     (one set, then back to work), but it is not in the break rotation today -
     see pickBreak().

     Two enormous targets, and their meaning never moves: BOOM is the circle on
     the LEFT, CLAP is the square on the RIGHT, for every level, every round, both
     orientations. A student who cannot see the screen well learns where they
     are by position and keeps that knowledge for the whole game; moving them,
     or swapping which is which, would throw away the only spatial fact the
     activity teaches.

     Same z-index as Carl's break (50): above the activity, BELOW the ⌂ and ×
     buttons (60), so the adult in the room can always walk out of it. */
  #rhythm {
    display:none; position:absolute; inset:0; z-index:50; background:#000;
    touch-action:none; grid-template-rows:auto auto minmax(0,1fr);
    align-content:stretch;
  }
  #rhythm.on { display:grid; }
  /* The beat band. A visual pulse that runs for the WHOLE break - through the
     demo, the student's turn, the rests and the talking - so the underlying
     pulse is visible as well as audible even at the moments when nothing else
     is happening. Thin, full width, and at the very top, where it cannot be
     mistaken for one of the two targets. */
  #rhythmBand { height:clamp(12px,2.6vh,28px); background:#1b1b1b; }
  #rhythmBand.beat { background:#8a8a8a; }
  #rhythmBand.downbeat { background:#fff; }
  /* For the adult in the room: which level, which pattern, and the last score.
     Deliberately the smallest thing on the screen - the student works off the
     sound and the two shapes, and every pixel this takes is a pixel the
     targets do not get. */
  #rhythmBanner {
    color:#ffd60a; font:600 clamp(13px,2.6vh,26px)/1.25 Arial,sans-serif;
    text-align:center; padding:clamp(4px,1.2vh,12px) 3vw 0; min-height:1.3em;
  }
  #rhythmTargets {
    display:flex; align-items:center; justify-content:center;
    gap:clamp(14px,3vw,56px); min-height:0; min-width:0;
    padding:0 clamp(6px,1.5vw,20px) max(1vh,8px);
  }
  /* As big as the screen allows, in both orientations. The height term is the
     ROW's own height, not a slice of the viewport, so the targets grow into
     whatever the band, the banner and the judge line leave behind instead of
     guessing at it - measured, that was 340 px of wasted screen on a 2184x1114
     landscape tablet. 45vw is the other term: two of those plus the gap and
     the padding is 96vw, so the width binds in portrait and the height binds
     in landscape, which is the right way round. */
  .rhythmTarget {
    /* 93%, not 100%: the cue pulse scales to 1.07, and 0.93 x 1.07 is 0.995 -
       so the grown shape still fits the row instead of being clipped by the
       app's overflow:hidden at the exact moment it is asking to be hit. */
    height:min(93%,45vw); width:auto; aspect-ratio:1;
    flex:0 0 auto; padding:0; margin:0;
    border:clamp(7px,1.6vh,16px) solid #8a8a8a; background:#0d0d0d;
    color:#fff; font:700 clamp(18px,6vh,70px)/1 Arial,sans-serif;
    letter-spacing:.03em;
    display:grid; place-items:center; touch-action:none;
    transition:transform .07s ease-out, border-color .07s linear,
               background .07s linear, opacity .12s linear;
    will-change:transform;
  }
  /* Shape is the primary difference, the word inside it is the second, and
     position is the third. Colour is a fourth cue on top of those three, never
     the only one. */
  #rhythmBoom { border-radius:50%; border-color:#ff9f0a; }
  #rhythmClap  { border-radius:clamp(8px,2.2vw,24px); border-color:#0a84ff; }
  /* "Hit this one, NOW." White ring and a jump in size, so the cue reads
     without relying on the fill colour at all. */
  #rhythmBoom.cue, #rhythmClap.cue {
    border-color:#fff; background:#2e2e2e; transform:scale(1.07);
  }
  /* GREYED OUT while the band demonstrates. This is the "hands off" signal and
     it has to read instantly and without colour: the whole target dims, the
     ring goes flat grey and it shrinks slightly - three changes at once,
     because a low-vision student may only catch one of them. The JS disables
     the buttons as well; this is the visible half of a real gate. */
  #rhythmBoom.locked, #rhythmClap.locked {
    border-color:#3a3a3a; background:#070707; color:#4a4a4a;
    transform:scale(.95); opacity:.55;
  }
  /* The student's own tap. Fires on every tap, always: the targets are an
     instrument and nothing about them is ever measured. */
  #rhythmBoom.hit, #rhythmClap.hit {
    border-color:#30d158; background:#13361f; transform:scale(.9);
  }
  /* A cue must still read while the targets are locked - that IS the
     demonstration - so it outranks .locked by being written after it. */
  #rhythmBoom.locked.cue, #rhythmClap.locked.cue {
    border-color:#fff; background:#2e2e2e; color:#fff;
    transform:scale(1.04); opacity:1;
  }
</style>
</head>
<body>
<div id="app">
  <div id="traceWrap"><canvas id="traceCanvas"></canvas></div>
  <div id="boxes" aria-hidden="true"></div>
  <div id="sightWord" aria-hidden="true"></div>
  <div id="braille" aria-label="Braille cells"></div>
  <button id="fullscreen" type="button">⛶ Full screen</button>
  <div id="fullscreenStatus" role="status"></div>
  <button id="home" aria-label="Double tap to return to the activity menu">⌂</button>
  <button id="exit" aria-label="Double tap to exit">×</button>
  <div id="success"></div>
  <div id="minigame" aria-hidden="true"></div>
  <div id="brainbreak" aria-hidden="true"><div id="carl"><img src="img/carl.png" alt=""></div></div>
  <!-- The rhythm brain break. An ALTERNATIVE to Carl's dance, not a fifth
       activity: the braille work still decides when a break happens. BOOM is
       the circle on the left and CLAP is the square on the right, here and in
       every level - the markup order is the screen order and must stay it. -->
  <div id="rhythm" aria-hidden="true">
    <div id="rhythmBand" aria-hidden="true"></div>
    <div id="rhythmBanner" role="status"></div>
    <div id="rhythmTargets">
      <button id="rhythmBoom" class="rhythmTarget" type="button"
              aria-label="Boom. The circle, on the left.">BOOM</button>
      <button id="rhythmClap" class="rhythmTarget" type="button"
              aria-label="Clap. The square, on the right.">CLAP</button>
    </div>
  </div>
  <div id="splash" role="button" tabindex="0" aria-label="Tap anywhere to start">
    <div id="splashInner">
      <div id="splashDot"></div>
      <div id="splashText">Tap to start</div>
    </div>
  </div>
  <div id="chooser" aria-label="Choose an activity">
    <div id="chooserInner">
      <div class="chooserRow" id="chooserModes">
        <button class="card" type="button" data-mode="letters" data-sample="abc"><b></b><span>Letters</span></button>
        <button class="card" type="button" data-mode="cvc" data-sample="cat"><b></b><span>CVC</span></button>
        <button class="card" type="button" data-mode="numbers" data-sample="123"><b></b><span>Numbers</span></button>
        <button class="card" type="button" data-mode="sight" data-sample="the"><b></b><span>High Frequency Words</span></button>
        <button class="card" type="button" data-mode="rhythm"><b class="sym">●■</b><span>Rhythm</span><em>under construction</em></button>
      </div>
      <div class="chooserRow" id="chooserVowels" hidden>
        <div class="chooserLabel">Which vowel?</div>
        <div class="chooserRow"></div>
      </div>
      <!-- Which braille convention the sight words use. Asked once, by the
           adult, for the same reason the vowel is: it is a teaching decision,
           and there is no way to change it from the activity screen. -->
      <div class="chooserRow" id="chooserSight" hidden>
        <div class="chooserLabel">Which braille?</div>
        <div class="chooserRow">
          <button class="card sightOpt" type="button" data-convention="grapheme" data-sample="t h e"><b></b><span>Letter by letter</span></button>
          <button class="card sightOpt" type="button" data-convention="ueb" data-sample="the"><b></b><span>UEB contractions</span></button>
        </div>
      </div>
    </div>
  </div>
  <div id="exitMessage">Exited</div>
</div>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------ no zoom ---
  // CSS touch-action:none (below, on every tappable element) is the first
  // line of defense, but iOS Safari has long-standing gaps where it still
  // starts a pinch-zoom anyway. 'gesturestart'/'gesturechange' are WebKit's
  // own pinch events and blocking them is the one technique that reliably
  // holds on an iPad even when touch-action doesn't. A second finger landing
  // mid-touch (touchmove with >1 touch) is covered the same way.
  const killGesture = ev => ev.preventDefault();
  document.addEventListener('gesturestart', killGesture);
  document.addEventListener('gesturechange', killGesture);
  document.addEventListener('gestureend', killGesture);
  document.addEventListener('touchmove', ev => {
    if (ev.touches.length > 1) ev.preventDefault();
  }, { passive:false });
  // Belt-and-braces: if the page still ends up zoomed (an OS gesture we
  // didn't catch), snap it back to scale 1 ourselves so the adult in the
  // room never has to reload. Rewriting the viewport meta's content to a
  // different string is what makes Safari actually recompute the scale.
  const viewportMeta = document.querySelector('meta[name="viewport"]');
  const viewportContent = viewportMeta.getAttribute('content');
  function resetPageZoom() {
    viewportMeta.setAttribute('content', viewportContent + ',minimum-scale=1');
    requestAnimationFrame(() => viewportMeta.setAttribute('content', viewportContent));
  }
  window.visualViewport?.addEventListener('resize', () => {
    if (window.visualViewport.scale > 1.02) resetPageZoom();
  });

  const canvas = document.getElementById('traceCanvas');
  const ctx = canvas.getContext('2d', { alpha:false });
  const brailleEl = document.getElementById('braille');
  const boxesEl = document.getElementById('boxes');
  const sightWordEl = document.getElementById('sightWord');
  const exitBtn = document.getElementById('exit');
  const success = document.getElementById('success');
  const exitMessage = document.getElementById('exitMessage');
  const minigame = document.getElementById('minigame');

  // ---------------------------------------------------------------- audio ---
  // One shared context, unlocked by the student's first touch anywhere.
  // Every sound hangs off masterGain so a single node controls overall level.
  let audioCtx=null, masterGain=null;
  function audio() {
    if (!audioCtx) {
      const Ctor=window.AudioContext||window.webkitAudioContext;
      if (!Ctor) return null;
      try { audioCtx=new Ctor(); } catch { return null; }
      masterGain=audioCtx.createGain();
      masterGain.gain.value=1;
      // The brush is loud and the tones stack on top of it; a gentle compressor
      // keeps the sum from clipping into harshness on a tablet speaker.
      const limiter=audioCtx.createDynamicsCompressor();
      limiter.threshold.value=-12; limiter.knee.value=18; limiter.ratio.value=4;
      limiter.attack.value=.004; limiter.release.value=.18;
      masterGain.connect(limiter); limiter.connect(audioCtx.destination);
    }
    if (audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  document.addEventListener('pointerdown',audio,{capture:true,passive:true});

  // Equal-tempered C major, one tone per braille dot position.
  // Left column top-to-bottom = C D E, right column top-to-bottom = F G A.
  // The mapping NEVER changes: dot position is what the student learns to hear.
  const DOT_TONE = { 1:261.63, 2:293.66, 3:329.63, 4:349.23, 5:392.00, 6:440.00 };

  function playTone(freq,{dur=.6,vol=.3,type='triangle',octave=true,delay=0}={}) {
    const ac=audio(); if (!ac) return;
    const t0=ac.currentTime+delay;
    const env=ac.createGain();
    env.gain.setValueAtTime(0,t0);
    env.gain.linearRampToValueAtTime(vol,t0+.014);
    env.gain.exponentialRampToValueAtTime(.0008,t0+dur);
    env.connect(masterGain);
    const osc=ac.createOscillator();
    osc.type=type; osc.frequency.value=freq;
    osc.connect(env); osc.start(t0); osc.stop(t0+dur+.05);
    if (octave) { // a touch of second harmonic keeps it bell-like, not buzzy
      const hi=ac.createOscillator(), hiGain=ac.createGain();
      hi.type='sine'; hi.frequency.value=freq*2; hiGain.gain.value=.26;
      hi.connect(hiGain).connect(env); hi.start(t0); hi.stop(t0+dur+.05);
    }
  }

  // ------------------------------------------------------ recorded audio ---
  // Played through plain <audio>, NOT decodeAudioData, so the app still works
  // opened straight off a USB stick: fetch() is blocked on file://, <audio> is not.
  // Letter phonemes are the human recordings from PhonicsFarm; whole words and
  // number names are local Kokoro. See audio/ and README.
  const clipCache=new Map();
  let currentClip=null;
  function clip(src) {
    let a=clipCache.get(src);
    if (!a) { a=new Audio(src); a.preload='auto'; clipCache.set(src,a); }
    return a;
  }
  function playClip(src,onEnd) {
    const a=clip(src);
    if (currentClip && currentClip!==a) { try { currentClip.pause(); } catch {} }
    currentClip=a;
    try { a.pause(); a.currentTime=0; } catch {}
    let fired=false;
    // A missing or undecodable file must never strand the student mid-word, so the
    // continuation is also armed on a timer and on the error path.
    const finish=()=>{ if (fired) return; fired=true; a.removeEventListener('ended',finish); onEnd&&onEnd(); };
    if (onEnd) {
      a.addEventListener('ended',finish);
      // The fallback has to outlast the clip, or it pre-empts the real 'ended'
      // event. A flat 2600 did exactly that: prompt-what.wav is 2.68 s. Use the
      // real duration once metadata is in, and keep 2600 as the floor for the
      // case where it never loads (missing/undecodable file).
      const dur = Number.isFinite(a.duration) && a.duration>0 ? a.duration*1000+400 : 0;
      setTimeout(finish, Math.max(2600, dur));
    }
    const played=a.play();
    if (played && played.catch) played.catch(finish);
    return a;
  }
  const phonemeSrc=ch=>`audio/phonemes/${ch}.wav`;
  const wordSrc=w=>`audio/words/${w}.wav`;
  const numberSrc=d=>`audio/numbers/${d}.wav`;
  // The letter NAME, not its phoneme. A sight word is recognised and spelled,
  // never sounded out, so audio/phonemes/ is wrong here by design.
  const letterNameSrc=ch=>`audio/letters/${ch}.wav`;
  // ⚠️ MUTED ON PURPOSE - awaiting recordings from an educator.
  // The TTS letter names in audio/letters/ were rejected on listening, so no
  // letter name is spoken in this section at all. A cell with no sound is a
  // path the sequencer already takes (it is how the number sign and the
  // capital indicator behave), so muting changes nothing else: the dot tones
  // still sound, the cell still advances, and the word is still spoken at the
  // end. Flip this back to true once real recordings land in audio/letters/.
  // The files are kept rather than deleted so a replacement is a drop-in.
  const SIGHT_SPEAK_LETTER_NAMES = false;
  const sightLetterSound=ch=>SIGHT_SPEAK_LETTER_NAMES ? letterNameSrc(ch) : null;
  // The word "I" lives at sight/i.wav: a filename differing from another only
  // by case is a trap on a case-insensitive checkout.
  const sightSrc=w=>`audio/sight/${w.toLowerCase()}.wav`;
  const SIGHT_ASK='audio/sight/prompt-what.wav';
  const SIGHT_REVEAL='audio/sight/prompt-reveal.wav';

  // Short filtered noise transient: the "pop" of a shape bursting.
  let popBuffer=null;
  function playPop() {
    const ac=audio(); if (!ac) return;
    if (!popBuffer) {
      const n=Math.floor(ac.sampleRate*.07);
      popBuffer=ac.createBuffer(1,n,ac.sampleRate);
      const d=popBuffer.getChannelData(0);
      for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
    }
    const src=ac.createBufferSource(); src.buffer=popBuffer;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=.9;
    const g=ac.createGain(); g.gain.value=.22;
    src.connect(bp).connect(g).connect(masterGain);
    src.start();
  }

  // The tracing sound: a brush stroke, not a buzz. Pink noise through a bandpass
  // that opens as the finger moves faster, so careful tracing whispers and a
  // confident sweep swooshes. The noise source loops for the whole session and
  // only the output gain moves, so starting and stopping stays click-free.
  const BRUSH_LEVEL=.62;
  let brushNodes=null, brushAudible=false, brushIdle=null;

  // Pink (1/f) rather than white: white noise reads as radio static, pink has
  // the low-end weight that makes it sound like bristles on paper.
  // Paul Kellet's refined approximation.
  function pinkNoiseBuffer(ac,seconds) {
    const n=Math.floor(ac.sampleRate*seconds);
    const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i=0;i<n;i++) {
      const w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.96900*b2+w*.1538520;
      b3=.86650*b3+w*.3104856; b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;
      b6=w*.115926;
    }
    return buf;
  }

  function buildBrush() {
    if (brushNodes) return brushNodes;
    const ac=audio(); if (!ac) return null;
    const out=ac.createGain(); out.gain.value=0; out.connect(masterGain);
    // Lowpass shaves the top hiss that would read as static; the bandpass is the
    // moving part, and some unfiltered body underneath keeps it from sounding
    // thin through a tablet speaker.
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6500; lp.Q.value=.5;
    lp.connect(out);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=.75;
    bp.connect(lp);
    const body=ac.createGain(); body.gain.value=.38; body.connect(lp);
    const src=ac.createBufferSource();
    src.buffer=pinkNoiseBuffer(ac,4); src.loop=true;
    src.connect(bp); src.connect(body);
    src.start();
    brushNodes={out,bp};
    return brushNodes;
  }

  function brushOn() {
    if (brushAudible) return;
    const n=buildBrush(); if (!n) return;
    brushAudible=true;
    n.out.gain.cancelScheduledValues(audioCtx.currentTime);
    n.out.gain.setTargetAtTime(BRUSH_LEVEL,audioCtx.currentTime,.015);
  }
  function brushOff() {
    clearTimeout(brushIdle); brushIdle=null;
    if (!brushNodes || !brushAudible) { brushAudible=false; return; }
    brushAudible=false;
    brushNodes.out.gain.cancelScheduledValues(audioCtx.currentTime);
    brushNodes.out.gain.setTargetAtTime(0,audioCtx.currentTime,.03);
  }

  // Finger speed in px/ms both brightens the filter and pushes the level.
  // A stroke that stops moving settles to a quiet hiss rather than cutting out,
  // so the student still hears they are on the line.
  function brushSpeed(pxPerMs) {
    if (!brushNodes || !brushAudible) return;
    const norm=Math.max(0,Math.min(1,pxPerMs/1.6));
    const t=audioCtx.currentTime;
    brushNodes.bp.frequency.setTargetAtTime(700+norm*2600,t,.05);
    brushNodes.out.gain.setTargetAtTime(BRUSH_LEVEL*(.5+norm*.5),t,.05);
    // No pointermove fires while a finger rests, so decay the stroke ourselves.
    clearTimeout(brushIdle);
    brushIdle=setTimeout(()=>brushSpeed(0),90);
  }

  // Verified standard English braille alphabet: left column 1-2-3, right column 4-5-6.
  const BRAILLE = {
    a:[1], b:[1,2], c:[1,4], d:[1,4,5], e:[1,5],
    f:[1,2,4], g:[1,2,4,5], h:[1,2,5], i:[2,4], j:[2,4,5],
    k:[1,3], l:[1,2,3], m:[1,3,4], n:[1,3,4,5], o:[1,3,5],
    p:[1,2,3,4], q:[1,2,3,4,5], r:[1,2,3,5], s:[2,3,4], t:[2,3,4,5],
    u:[1,3,6], v:[1,2,3,6], w:[2,4,5,6], x:[1,3,4,6], y:[1,3,4,5,6], z:[1,3,5,6]
  };

  // Braille digits are the number sign followed by the letter a-j, so every
  // digit is genuinely TWO cells. He taps the number sign, then the letter.
  const NUMBER_SIGN = [3,4,5,6];
  const DIGIT_LETTER = { '1':'a','2':'b','3':'c','4':'d','5':'e',
                         '6':'f','7':'g','8':'h','9':'i','0':'j' };

  // Dot 6 alone. A capital letter in braille is genuinely two cells - this
  // indicator, then the letter - exactly the shape the number sign has in
  // Numbers, so the sequencer already knows what to do with it.
  const CAPITAL_SIGN = [6];

  // ---------------------------------------------------------- sight words ---
  // First tranche, as given. "I" is capitalised throughout: capital in print,
  // capital indicator in braille.
  const SIGHT_WORDS = ['the','is','it','said','and','as','a','I'];

  // The teacher picks the convention for the whole session. `grapheme` spells
  // every word out, one cell per print letter, and is the default because it
  // is what the rest of this app teaches and the only form in which naming a
  // letter per cell means anything.
  //
  // `ueb` is how these words actually appear in Unified English Braille. A
  // cell gets a spoken letter name only when it IS that letter in the
  // spelling: the wordsign cells are silent, because naming "ex" over the one
  // cell that means `it` would teach the wrong thing. Dots cross-checked
  // against the alphabet table above - `it` is the letter x, `as` is z.
  const SIGHT_UEB = {
    the:  [{ dots:[2,3,4,6] }],                    // strong wordsign
    is:   [{ name:'i' }, { name:'s' }],            // no contraction, spelled
    it:   [{ dots:[1,3,4,6] }],                    // alphabetic wordsign (x)
    said: [{ name:'s' }, { name:'d' }],            // shortform  s-d
    and:  [{ dots:[1,2,3,4,6] }],                  // strong wordsign
    as:   [{ dots:[1,3,5,6] }],                    // alphabetic wordsign (z)
    a:    [{ name:'a' }],
    I:    [{ dots:CAPITAL_SIGN }, { name:'i' }]
  };

  const COLOR_PAIRS = [
    ['#ff453a','#30d158'], // red / green
    ['#ffd60a','#0a84ff'], // yellow / blue
    ['#ff9f0a','#5e5ce6'], // orange / indigo
    ['#ff375f','#40c8e0'], // pink / cyan
    ['#bf5af2','#a8ff3e'], // purple / lime
    ['#64d2ff','#ff453a']  // cyan / red
  ];

  // Smooth school-print centerlines: x-height 70, ascenders 100, descenders 30.
  // SVG curves are sampled by distance for the existing coverage logic.
  const PATHS = {
    a:['M60 30 C60 12 48 0 30 0 C10 0 0 15 0 35 C0 55 10 70 30 70 C48 70 60 58 60 40','M60 0 L60 70'],
    b:['M0 -30 L0 70','M0 30 C0 12 12 0 30 0 C50 0 60 15 60 35 C60 55 50 70 30 70 C12 70 0 58 0 40'],
    c:['M57 10 C49 3 40 0 30 0 C10 0 0 15 0 35 C0 55 10 70 30 70 C40 70 49 67 57 60'],
    d:['M60 30 C60 12 48 0 30 0 C10 0 0 15 0 35 C0 55 10 70 30 70 C48 70 60 58 60 40','M60 -30 L60 70'],
    e:['M0 33 L60 33 C60 12 48 0 30 0 C10 0 0 15 0 35 C0 55 12 70 32 70 C43 70 52 66 59 60'],
    f:['M45 -25 C26 -38 15 -24 15 -8 L15 70','M0 8 L38 8'],
    g:['M60 30 C60 12 48 0 30 0 C10 0 0 15 0 35 C0 55 10 70 30 70 C48 70 60 58 60 40','M60 0 L60 76 C60 105 26 110 7 94'],
    h:['M0 -30 L0 70','M0 29 C0 10 13 0 29 0 C46 0 55 11 55 28 L55 70'],
    i:['M0 -24 L0 -23.9','M0 0 L0 70'],
    j:['M25 -24 L25 -23.9','M25 0 L25 78 C25 96 14 103 0 96'],
    k:['M0 -30 L0 70','M53 0 L0 38 L56 70'],
    l:['M0 -30 L0 70'],
    m:['M0 0 L0 70','M0 25 C0 -8 44 -8 44 25 L44 70','M44 25 C44 -8 88 -8 88 25 L88 70'],
    n:['M0 0 L0 70','M0 29 C0 10 13 0 29 0 C46 0 55 11 55 28 L55 70'],
    o:['M60 35 C60 14 49 0 30 0 C11 0 0 14 0 35 C0 56 11 70 30 70 C49 70 60 56 60 35'],
    p:['M0 0 L0 100','M0 30 C0 12 12 0 30 0 C50 0 60 15 60 35 C60 55 50 70 30 70 C12 70 0 58 0 40'],
    q:['M60 30 C60 12 48 0 30 0 C10 0 0 15 0 35 C0 55 10 70 30 70 C48 70 60 58 60 40','M60 0 L60 100'],
    r:['M0 0 L0 70','M0 30 C0 7 17 -4 36 3'],
    s:['M53 8 C42 -2 15 -5 6 10 C-8 36 57 29 57 52 C57 75 20 77 1 62'],
    t:['M23 -25 L23 70','M0 0 L48 0'],
    u:['M0 0 L0 42 C0 61 9 70 26 70 C44 70 55 58 55 40','M55 0 L55 70'],
    v:['M0 0 L30 70 L60 0'],
    w:['M0 0 L22 70 L44 8 L66 70 L88 0'],
    x:['M0 0 L60 70','M60 0 L0 70'],
    y:['M0 0 L30 63','M60 0 L15 100'],
    z:['M0 0 L60 0 L0 70 L60 70'],
    // The only capital the app needs: the sight word "I", which is a capital
    // in print and a capital in braille. Cap height is the ascender line, and
    // school-print manuscript gives it both crossbars - a bare vertical would
    // read as a lowercase l. Stem first, then the bars, as it is taught.
    I:['M30 -30 L30 70','M5 -30 L55 -30','M5 70 L55 70'],
    // Digits are ascender-height (-30 to 70) and drawn in school-print writing
    // order, same centerline space and stroke weight as the letters.
    '0':['M28 -30 C12 -30 2 -8 2 20 C2 48 12 70 28 70 C44 70 54 48 54 20 C54 -8 44 -30 28 -30'],
    '1':['M6 -14 L26 -30 L26 70'],
    '2':['M4 -12 C6 -27 24 -34 39 -27 C54 -20 55 -1 38 14 C24 27 11 44 3 70 L55 70'],
    '3':['M5 -17 C15 -31 43 -31 48 -15 C52 0 37 17 21 19 C39 18 56 27 54 44 C52 62 26 76 4 62'],
    '4':['M40 -30 L2 32 L54 32','M40 -30 L40 70'],
    '5':['M52 -30 L8 -30 L6 12 C24 2 50 8 53 32 C56 54 34 74 7 62'],
    '6':['M46 -23 C26 -33 4 -12 4 24 C4 52 14 70 30 70 C46 70 55 57 53 43 C51 28 32 20 18 28 C12 31 8 36 7 40'],
    '7':['M3 -30 L54 -30 L20 70'],
    '8':['M29 -30 C16 -30 9 -22 9 -12 C9 2 23 10 33 18 C45 27 51 36 51 48 C51 61 42 70 29 70 C16 70 7 61 7 48 C7 36 13 27 25 18 C35 10 49 2 49 -12 C49 -22 42 -30 29 -30'],
    '9':['M51 2 C49 -19 40 -30 27 -30 C13 -30 4 -20 4 -6 C4 8 14 18 28 18 C40 18 49 12 51 2 L51 70']
  };
  const GLYPHS = Object.fromEntries(Object.entries(PATHS).map(([ch,paths]) => [ch,paths.map(d => {
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    const length=path.getTotalLength(), count=Math.max(1,Math.ceil(length/2));
    return Array.from({length:count+1},(_,i)=>{
      const p=path.getPointAtLength(length*i/count); return [p.x,-p.y];
    });
  })]));

  // The owner's list, in the owner's order. The vowel sequence a-i-o-e-u is not
  // alphabetical by accident: e and i are the most confusable short vowels, so
  // teaching programs deliberately separate them. Do not "fix" it to a-e-i-o-u.
  const CVC_WORDS = {
    a:['cat','hat','sat','mat','fat','rat','map','bag','man','can'],
    i:['sit','pit','hit','fit','kit','pig','lip','fin','hid'],
    o:['mop','top','cop','hop','not','dog','rob'],
    e:['bet','wet','met','set','get','bed','leg'],
    u:['cup','pup','sun','run','fun','nut']
  };
  const VOWEL_ORDER = ['a','i','o','e','u'];

  let mode='letters';   // 'letters' | 'cvc' | 'numbers' | 'sight'
  let cvcVowel=null;    // a key of CVC_WORDS, or null for a mix of all
  let sightConvention='grapheme';  // 'grapheme' | 'ueb'
  // Round 1 shows the print word above the dots; round 2 shows the dots alone
  // and asks for the word. Round 2 begins only once round 1 has used the whole
  // list, so the words are familiar before they are tested.
  let sightRound=1;
  let sightGroups=[];   // the per-letter <g> of the printed word, in order
  let cells=[];         // the braille cells of the current item, in tap order
  let activeCell=0;

  let order=[];
  let orderIndex=0;
  let glyph='a';       // the character being TRACED: a letter or a digit
  let colorPair=COLOR_PAIRS[0];
  let coverage=[];
  let traceDone=false;
  let word=null;        // the CVC word being built, or null outside CVC mode
  let markerSegments=[];
  let drawing=false;
  let lastMoveTime=0;
  let advancing=false;
  let currentPointer=null;
  let lastPointerScreen=null;

  function shuffle(list) {
    for (let i=list.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
    return list;
  }

  function buildOrder() {
    orderIndex=0;
    if (mode==='cvc') {
      order=shuffle(cvcVowel ? [...CVC_WORDS[cvcVowel]]
                             : VOWEL_ORDER.flatMap(v=>CVC_WORDS[v]));
      return;
    }
    if (mode==='numbers') { order=shuffle('0123456789'.split('')); return; }
    if (mode==='sight') { order=shuffle([...SIGHT_WORDS]); return; }
    const forced=(new URLSearchParams(location.search).get('letter')||'').toLowerCase();
    if (/^[a-z]$/.test(forced)) { order=[forced]; return; }
    order=shuffle('abcdefghijklmnopqrstuvwxyz'.split(''));
  }

  function cssVar(name,value) { document.documentElement.style.setProperty(name,value); }

  const GLYPH_BOUNDS = Object.fromEntries(Object.entries(GLYPHS).map(([ch,strokes])=>{
    const pts=strokes.flat();
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    return [ch,{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)}];
  }));

  function currentTransform() {
    const w=canvas.clientWidth, h=canvas.clientHeight;
    const b=GLYPH_BOUNDS[glyph];
    const glyphW=Math.max(1,b.maxX-b.minX), glyphH=Math.max(1,b.maxY-b.minY);
    // Uniform scaling is critical: never stretch a glyph differently in portrait and landscape.
    // 1.25 CSS inches above ALL guide ink; extra allowance for reaching fingers.
    // CSS inches cannot guarantee a physical inch on every tablet/display.
    const landscape=w>h || matchMedia('(orientation:landscape)').matches;
    const top=landscape ? 120 : 32, bottom=landscape ? 76 : 24;
    const padX=Math.max(28,w*.07), strokeUnits=10;
    const availableH=Math.max(20,h-top-bottom);
    const scale=Math.max(.05,Math.min((w-2*padX)/(glyphW+strokeUnits),availableH/(glyphH+strokeUnits)));
    return {
      w,h,scale, guideWidth:strokeUnits*scale,
      cx:(b.minX+b.maxX)/2, cy:(b.minY+b.maxY)/2,
      screenX:w/2, screenY:top+availableH/2
    };
  }

  function localToScreen([x,y],t=currentTransform()) {
    return [t.screenX+(x-t.cx)*t.scale, t.screenY-(y-t.cy)*t.scale];
  }

  function screenToLocal([x,y],t=currentTransform()) {
    return [t.cx+(x-t.screenX)/t.scale, t.cy-(y-t.screenY)/t.scale];
  }

  function currentGeometry() {
    const t=currentTransform();
    return GLYPHS[glyph].map(stroke=>stroke.map(p=>localToScreen(p,t)));
  }

  function resizeCanvas() {
    stopDrawing();
    const r=canvas.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(r.width*dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
    // A rotation mid-minigame would otherwise leave the live shape off-screen.
    if (minigameActive() && !mgBusy) spawnShape();
  }

  // A cell is {char, required, sound, touched, done, el, dotEls}. An item is an
  // ordered list of them: one for a letter, two for a digit (number sign then
  // the letter cell), three for a CVC word. Only the active cell is live.
  function buildCells(specs) {
    cells=specs.map(spec=>({ ...spec, touched:new Set(), done:false, el:null, dotEls:{} }));
    activeCell=0;
    brailleEl.textContent='';
    brailleEl.className='cells-'+cells.length;
    for (const cell of cells) {
      const el=document.createElement('div');
      el.className='cell';
      for (const column of [[1,2,3],[4,5,6]]) {
        const col=document.createElement('div');
        col.className='brailleCol';
        for (const n of column) {
          const dot=document.createElement('div');
          dot.className='dot'+(cell.required.includes(n)?' required':'');
          dot.dataset.dot=String(n);
          cell.dotEls[n]=dot;
          col.appendChild(dot);
        }
        el.appendChild(col);
      }
      cell.el=el;
      brailleEl.appendChild(el);
    }
    paintCells();
  }

  function paintCells() {
    cells.forEach((cell,i)=>{
      cell.el.classList.toggle('active',i===activeCell && !cell.done);
      cell.el.classList.toggle('done',cell.done);
    });
    if (sightGroups.length) {
      // perLetter is false under UEB, where one cell can be a whole word: then
      // there is no current letter, and the print word simply turns green when
      // it is finished.
      const perLetter=cells.some(c=>c.letter!=null);
      const allDone=cells.every(c=>c.done);
      const active=cells[activeCell];
      sightGroups.forEach((g,i)=>{
        const done=allDone || (perLetter && cells.every(c=>c.letter!==i || c.done));
        g.classList.toggle('done',done);
        g.classList.toggle('active',!done && perLetter && !!active && active.letter===i);
      });
    }
    if (!boxesEl.children.length) return;
    [...boxesEl.children].forEach((box,i)=>{
      box.classList.toggle('active',i===activeCell && !cells[i].done);
      box.classList.toggle('done',cells[i] && cells[i].done);
    });
  }

  // The print letters are drawn from the SAME centerlines the tracing guide
  // uses, not set in a font. Two reasons: it guarantees the single-story `a`
  // and the serif-free `t` that school print wants and Arial does not have,
  // and it means the letter the student reads is identical to the one they trace.
  const SVGNS='http://www.w3.org/2000/svg';
  const PAD=7;  // half the 10-unit stroke, plus a hair
  const inkBounds=new Map();

  function glyphBounds(ch) {
    if (!inkBounds.has(ch)) {
      let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
      for (const d of PATHS[ch]) {
        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('d',d);
        const length=path.getTotalLength(), count=Math.max(1,Math.ceil(length/2));
        for (let i=0;i<=count;i++) {
          const pt=path.getPointAtLength(length*i/count);
          if (pt.x<minX) minX=pt.x;
          if (pt.x>maxX) maxX=pt.x;
          if (pt.y<minY) minY=pt.y;
          if (pt.y>maxY) maxY=pt.y;
        }
      }
      inkBounds.set(ch,{minX,maxX,minY,maxY});
    }
    return inkBounds.get(ch);
  }

  function buildBoxes(chars) {
    boxesEl.textContent='';
    // All three letters share ONE vertical range, so their baselines line up
    // and an ascender really does stand taller than an x-height letter. The
    // range is the word's own, not a fixed one: a word with no descender must
    // not sit high in its boxes reserving space for a tail it never grows.
    const top=Math.min(...chars.map(ch=>glyphBounds(ch).minY))-PAD;
    const bottom=Math.max(...chars.map(ch=>glyphBounds(ch).maxY))+PAD;
    for (const ch of chars) {
      const b=glyphBounds(ch);
      const svg=document.createElementNS(SVGNS,'svg');
      svg.setAttribute('viewBox',`${b.minX-PAD} ${top} ${(b.maxX-b.minX)+PAD*2} ${bottom-top}`);
      for (const d of PATHS[ch]) {
        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('d',d);
        svg.appendChild(path);
      }
      const box=document.createElement('div');
      box.className='box';
      box.appendChild(svg);
      boxesEl.appendChild(box);
    }
  }

  // `letter` is the index of the PRINT letter a cell belongs to, so the word
  // above can highlight the letter being answered. A capital shares its
  // letter's index with the indicator cell in front of it - both cells are
  // that one letter. UEB cells carry no index: a wordsign is one cell for the
  // whole word, so there is no "current letter" to point at.
  function sightCells(w) {
    if (sightConvention==='ueb') {
      return SIGHT_UEB[w].map(spec=>spec.name
        ? { char:spec.name, required:BRAILLE[spec.name], sound:sightLetterSound(spec.name) }
        : { char:'', required:spec.dots, sound:null });
    }
    const out=[];
    [...w].forEach((ch,i)=>{
      const lower=ch.toLowerCase();
      if (ch!==lower) out.push({ char:'', required:CAPITAL_SIGN, sound:null, letter:i });
      out.push({ char:lower, required:BRAILLE[lower], sound:sightLetterSound(lower), letter:i });
    });
    return out;
  }

  const SIGHT_GAP=22;   // space between letters, in glyph units

  // The whole word as a single svg, scaled to fit the row: see the CSS note on
  // why there are no per-letter boxes here.
  function buildSightWord(w) {
    sightWordEl.textContent='';
    sightGroups=[];
    const chars=[...w];
    // One shared vertical range for the word, the same reasoning as the CVC
    // boxes: baselines line up and an ascender really does stand taller than
    // an x-height letter, but the range is this word's own, so a word with no
    // descender does not reserve space for a tail it never grows.
    const top=Math.min(...chars.map(ch=>glyphBounds(ch).minY))-PAD;
    const bottom=Math.max(...chars.map(ch=>glyphBounds(ch).maxY))+PAD;
    const svg=document.createElementNS(SVGNS,'svg');
    let x=0;
    chars.forEach((ch,i)=>{
      const b=glyphBounds(ch);
      const g=document.createElementNS(SVGNS,'g');
      g.setAttribute('transform',`translate(${x-b.minX+PAD},0)`);
      for (const d of PATHS[ch]) {
        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('d',d);
        g.appendChild(path);
      }
      svg.appendChild(g);
      sightGroups.push(g);
      x+=(b.maxX-b.minX)+PAD*2+(i===chars.length-1 ? 0 : SIGHT_GAP);
    });
    svg.setAttribute('viewBox',`0 ${top} ${x} ${bottom-top}`);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    sightWordEl.appendChild(svg);
  }

  // A word drawn from the app's OWN centerlines, for the menu. Same reasoning
  // as the CVC boxes and the sight word: it is what guarantees the
  // single-story `a` and the serif-free `t` that school print wants and Arial
  // does not have, and it means the letter on a menu card is identical to the
  // one the student will go on to trace.
  //
  // A FONT cannot give that guarantee here. Whether a given family is present
  // is a property of the tablet, not of this file, and when it is missing the
  // fallback is silently a double-story `a` - the exact thing being avoided,
  // failing in the one way nobody notices. These paths are always right.
  //
  // Unknown characters are skipped and a space advances by one gap, so a
  // sample like "t h e" spaces out and "●■" simply yields nothing and leaves
  // the symbol text in place.
  function glyphWord(text) {
    const chars=[...text].filter(ch=>ch===' '||PATHS[ch]);
    const inked=chars.filter(ch=>ch!==' ');
    if (!inked.length) return null;
    const top=Math.min(...inked.map(ch=>glyphBounds(ch).minY))-PAD;
    const bottom=Math.max(...inked.map(ch=>glyphBounds(ch).maxY))+PAD;
    const svg=document.createElementNS(SVGNS,'svg');
    let x=0;
    chars.forEach((ch,i)=>{
      if (ch===' ') { x+=SIGHT_GAP; return; }
      const b=glyphBounds(ch);
      const g=document.createElementNS(SVGNS,'g');
      g.setAttribute('transform',`translate(${x-b.minX+PAD},0)`);
      for (const d of PATHS[ch]) {
        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('d',d);
        g.appendChild(path);
      }
      svg.appendChild(g);
      x+=(b.maxX-b.minX)+PAD*2+(i===chars.length-1 ? 0 : SIGHT_GAP);
    });
    svg.setAttribute('viewBox',`0 ${top} ${x} ${bottom-top}`);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('aria-hidden','true');
    return svg;
  }

  function setupItem() {
    stopDrawing();
    const item=order[orderIndex];
    colorPair=COLOR_PAIRS[Math.floor(Math.random()*COLOR_PAIRS.length)];
    cssVar('--letter',colorPair[0]); cssVar('--trace',colorPair[1]);

    if (mode!=='sight') { sightWordEl.textContent=''; sightGroups=[]; }

    if (mode==='cvc') {
      word=item;
      glyph=null;
      // Nothing to trace: the print letters are READ, and answered in braille.
      traceDone=true;
      buildBoxes(item.split(''));
      buildCells(item.split('').map(ch=>({ char:ch, required:BRAILLE[ch], sound:phonemeSrc(ch) })));
      clip(wordSrc(item));
    } else if (mode==='sight') {
      word=item;
      glyph=null;
      // Nothing to trace: the word is read, or recalled, and answered in braille.
      traceDone=true;
      boxesEl.textContent='';
      document.body.classList.toggle('round2',sightRound===2);
      // Round 2 shows no print at all. That is what makes it a reading test
      // rather than a matching exercise, so there is nothing to fall back on.
      if (sightRound===1) buildSightWord(item);
      else { sightWordEl.textContent=''; sightGroups=[]; }
      buildCells(sightCells(item));
      clip(sightSrc(item));
      // Round 2 asks UP FRONT: the question has to come before the student
      // answers in braille, not after it. REVEAL is only warmed here - it
      // plays once the dots are in. Round 2 never lands on the first card of
      // a session (start() sets sightRound=1), so a gesture has always
      // happened by now and this is allowed to autoplay.
      // Warm BOTH prompts in BOTH rounds. playClip's fallback timer needs a
      // real duration, and that is only known once the element has loaded its
      // metadata -- so warming only in round 2 left the very first round-2
      // card falling back to the 2600 ms floor and opening the gate ~80 ms
      // early, which is the bug the gate exists to prevent. Round 1 runs the
      // whole list first, so by round 2 both durations are known.
      clip(SIGHT_ASK); clip(SIGHT_REVEAL);
      if (sightRound===2) {
        const myRun=runId;
        setInputLocked(true);
        playClip(SIGHT_ASK,()=>{ if (myRun===runId) setInputLocked(false); });
      } else setInputLocked(false);
    } else if (mode==='numbers') {
      word=null;
      glyph=item;
      traceDone=false;
      boxesEl.textContent='';
      buildCells([
        { char:'#', required:NUMBER_SIGN, sound:null },
        { char:DIGIT_LETTER[item], required:BRAILLE[DIGIT_LETTER[item]], sound:null }
      ]);
      clip(numberSrc(item));
    } else {
      word=null;
      glyph=item;
      traceDone=false;
      boxesEl.textContent='';
      buildCells([{ char:item, required:BRAILLE[item], sound:phonemeSrc(item) }]);
    }

    if (glyph) {
      coverage=GLYPHS[glyph].map(stroke=>new Array(stroke.length).fill(false));
      markerSegments=[];
      draw();
    }
  }

  function drawPolyline(points,color,width,alpha=1) {
    if (!points.length) return;
    ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(points[0][0],points[0][1]);
    for (let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
    ctx.stroke();
  }

  function draw() {
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    if (!GLYPHS[glyph]) return;
    const geometry=currentGeometry();
    const guideWidth=currentTransform().guideWidth;
    const markerWidth=guideWidth*.76;
    for (const stroke of geometry) drawPolyline(stroke,colorPair[0],guideWidth,.96);
    const t=currentTransform();
    for (const segment of markerSegments) drawPolyline(segment.map(p=>localToScreen(p,t)),colorPair[1],markerWidth,1);
    ctx.globalAlpha=1;
  }

  function canvasPoint(ev) {
    const r=canvas.getBoundingClientRect();
    return [ev.clientX-r.left, ev.clientY-r.top];
  }

  // Deliberately generous motor-accessibility halo around the thick guide.
  function coverageRadius() {
    return Math.max(42,Math.min(canvas.clientWidth,canvas.clientHeight)*.105);
  }

  // Is the finger on the guide right now? Drives the brush, and is intentionally
  // the SAME halo the coverage test uses, so the sound reports exactly what counts.
  function onGuide(x,y,geometry=currentGeometry()) {
    const r2=coverageRadius()**2;
    for (const stroke of geometry) {
      for (const p of stroke) {
        const dx=x-p[0], dy=y-p[1];
        if (dx*dx+dy*dy<=r2) return true;
      }
    }
    return false;
  }

  function applyCoverage(x,y) {
    const geometry=currentGeometry();
    const radius=coverageRadius();
    const r2=radius*radius;
    for (let s=0;s<geometry.length;s++) {
      for (let i=0;i<geometry[s].length;i++) {
        const p=geometry[s][i], dx=x-p[0], dy=y-p[1];
        if (dx*dx+dy*dy<=r2) coverage[s][i]=true;
      }
    }
    // Every separately defined stroke has to be substantially covered.
    // For i/j, the first disconnected stroke is the dot: a deliberate touch counts; the stem still needs tracing.
    traceDone=coverage.every((bits,strokeIndex)=>{
      const ratio=bits.filter(Boolean).length/bits.length;
      const isDot=(glyph==='i'||glyph==='j') && strokeIndex===0;
      return ratio >= (isDot ? .18 : .70);
    });
    checkCompletion();
  }

  function addInterpolatedPoints(segment,from,to) {
    const dist=Math.hypot(to[0]-from[0],to[1]-from[1]);
    const steps=Math.max(1,Math.ceil(dist/8));
    const t=currentTransform();
    for (let i=1;i<=steps;i++) {
      const p=[from[0]+(to[0]-from[0])*i/steps, from[1]+(to[1]-from[1])*i/steps];
      segment.push(screenToLocal(p,t)); applyCoverage(p[0],p[1]);
    }
  }

  canvas.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    if (advancing || drawing) return;
    drawing=true; currentPointer=ev.pointerId;
    try { canvas.setPointerCapture(ev.pointerId); } catch {}
    const p=canvasPoint(ev);
    lastPointerScreen=p;
    lastMoveTime=performance.now();
    markerSegments.push([screenToLocal(p)]);
    applyCoverage(p[0],p[1]); draw();
    // Touching down counts as a stroke starting: open the filter a little so
    // the first contact is heard, rather than fading up from silence.
    if (onGuide(p[0],p[1])) { brushOn(); brushSpeed(.5); } else brushOff();
  });
  canvas.addEventListener('pointermove',ev=>{
    if (!drawing || ev.pointerId!==currentPointer) return;
    ev.preventDefault();
    const p=canvasPoint(ev), seg=markerSegments[markerSegments.length-1];
    const now=performance.now();
    // Floor the interval: a 1 ms gap on a 120 Hz digitiser would otherwise
    // report an absurd speed and spike the filter.
    const speed=Math.hypot(p[0]-lastPointerScreen[0],p[1]-lastPointerScreen[1])
                /Math.max(6,now-lastMoveTime);
    lastMoveTime=now;
    addInterpolatedPoints(seg,lastPointerScreen,p);
    lastPointerScreen=p;
    draw();
    // Re-checked on every move: wander off the guide and the brush drops out,
    // come back onto it and it returns. No restart cost either way.
    if (onGuide(p[0],p[1])) { brushOn(); brushSpeed(speed); } else brushOff();
  });
  function stopDrawing(ev) {
    if (ev && currentPointer!==null && ev.pointerId!==currentPointer) return;
    drawing=false; currentPointer=null; lastPointerScreen=null;
    brushOff();
  }
  canvas.addEventListener('pointerup',stopDrawing);
  canvas.addEventListener('pointercancel',stopDrawing);

  // Delegated: the dots are rebuilt for every item, so the listener lives on
  // the container and never has to be re-attached.
  brailleEl.addEventListener('pointerdown',ev=>{
    const d=ev.target.closest('.dot');
    if (!d) return;
    ev.preventDefault();
    if (advancing) return;
    // The question has to finish before the answer is possible: on a one-cell
    // word a quick student could otherwise beat the prompt and cut it off.
    if (inputLocked) return;
    const cell=cells[activeCell];
    // Dots in a backgrounded cell are inert, not merely silent. If the student could
    // answer the third cell while the first is live, the sequence would stop
    // teaching the ORDER of the letters, which is the whole point.
    if (!cell || cell.done || !cell.el.contains(d)) return;
    const n=Number(d.dataset.dot);
    // Only the dots this cell needs make a sound. Sounding the ghosted ones
    // too - the original design - turns the cell into a noise toy: a student
    // will hit them for the tone instead of reading the letter. Silence is the signal.
    if (!cell.required.includes(n)) return;
    playTone(DOT_TONE[n],{dur:.62,vol:.3});
    cell.touched.add(n);
    d.classList.add('hit');
    if (!cell.required.every(r=>cell.touched.has(r))) return;
    // If this was the final cell, the word must wait for this phoneme to finish
    // speaking - on a fixed timer it cut the last sound off part-way through.
    const last=cells.every(c=>c.done||c===cell);
    completeCell(cell, last ? checkCompletion : null);
  });

  function completeCell(cell,after) {
    cell.done=true;
    // The cell recedes as its own sound plays, then the next comes forward:
    // the sound belongs to the cell just finished, not the one starting.
    const next=cells.findIndex(c=>!c.done);
    activeCell=next===-1 ? cells.length-1 : next;
    paintCells();
    if (cell.sound) setTimeout(()=>playClip(cell.sound,after),140);
    else if (after) setTimeout(after,180);
  }

  // ------------------------------------------------------- shape minigame ---
  // Each shape hands out the next note of a nursery tune when it is touched,
  // so the melody assembles itself at whatever pace the student works at rather
  // than demanding they keep time with a track.
  //
  // The tune is how the student knows which activity they are in: tracing (letters and
  // numbers) always plays Mary, blending (words) always plays Twinkle. It is
  // the only per-mode cue in the reward round, so do not shuffle them.
  // Both sit an octave above the braille dot tones, so a reward never muddles
  // the dot drill.
  const TUNES = {
    // "Twinkle Twinkle Little Star", first seven notes: C C G G A A G.
    twinkle: [523.25, 523.25, 783.99, 783.99, 880.00, 880.00, 783.99],
    // "Mary Had a Little Lamb", first seven notes: E D C D E E E.
    mary:    [659.25, 587.33, 523.25, 587.33, 659.25, 659.25, 659.25],
    // "London Bridge Is Falling Down", G A G F E F G - one whole phrase in
    // exactly seven notes. It starts on G and arches, where Mary starts on E
    // and falls and Twinkle starts on a repeated C, so the three are told
    // apart from the first note.
    london:  [783.99, 880.00, 783.99, 698.46, 659.25, 698.46, 783.99]
  };
  const MODE_TUNE = { letters:'mary', numbers:'mary', cvc:'twinkle', sight:'london' };
  // Both phrases end on a long note, so the last shape resolves instead of
  // just stopping. Keep this if a longer tune is ever added.
  const LAST_NOTE_DUR = 1.0, NOTE_DUR = .6;
  const ROW_MAX = 7;   // past this a round wraps back to the left for a 2nd row

  // Standard kindergarten shapes, drawn in a 0 0 100 100 box.
  const SHAPES = {
    circle:    '<circle cx="50" cy="50" r="47"/>',
    square:    '<rect x="4" y="4" width="92" height="92" rx="7"/>',
    triangle:  '<polygon points="50,4 96,93 4,93"/>',
    rectangle: '<rect x="2" y="21" width="96" height="58" rx="7"/>',
    oval:      '<ellipse cx="50" cy="50" rx="47" ry="33"/>',
    diamond:   '<polygon points="50,2 98,50 50,98 2,50"/>',
    star:      '<polygon points="50,2 61.5,34.2 95.7,35.2 68.6,56 78.2,88.8 50,69.5 21.8,88.8 31.4,56 4.3,35.2 38.5,34.2"/>',
    heart:     '<path d="M50 90 C50 90 5 60 5 31 C5 13 19 5 32 5 C42 5 50 13 50 22 C50 13 58 5 68 5 C81 5 95 13 95 31 C95 60 50 90 50 90 Z"/>',
    hexagon:   '<polygon points="98,50 74,91.6 26,91.6 2,50 26,8.4 74,8.4"/>'
  };
  const SHAPE_NAMES = Object.keys(SHAPES);
  const SHAPE_COLORS = ['#ff453a','#ff9f0a','#ffd60a','#32d74b','#0a84ff',
                        '#bf5af2','#ff375f','#64d2ff','#a8ff3e','#ff6b35'];

  // There are 9 shapes and 10 colours but 13 beats, so a round MUST repeat some.
  // Drawing from reshuffled batches spreads the repeats out, and the adjacency
  // check stops the same shape or colour appearing twice in a row - which would
  // read as a bug rather than as a pattern. (Slicing one shuffled copy, as this
  // did when a round was 7 long, silently returns fewer than asked for.)
  function sample(list,count) {
    const out=[];
    while (out.length<count) {
      const pool=[...list];
      for (let i=pool.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [pool[i],pool[j]]=[pool[j],pool[i]];
      }
      if (out.length && pool[0]===out[out.length-1] && pool.length>1) {
        [pool[0],pool[1]]=[pool[1],pool[0]];
      }
      for (const item of pool) {
        if (out.length>=count) break;
        out.push(item);
      }
    }
    return out;
  }

  let mgRound=[], mgStep=0, mgOnFinish=null, mgBusy=false, mgTune=TUNES.twinkle;

  function minigameActive() { return minigame.classList.contains('on'); }

  function startMinigame(onFinish) {
    brushOff();
    mgOnFinish=onFinish;
    mgStep=0; mgBusy=false;
    mgTune=TUNES[MODE_TUNE[mode]] || TUNES.twinkle;
    // Shapes and colours are redrawn every round; the note order never is.
    const shapes=sample(SHAPE_NAMES,mgTune.length);
    const colors=sample(SHAPE_COLORS,mgTune.length);
    mgRound=shapes.map((name,i)=>({name,color:colors[i]}));
    minigame.textContent='';
    minigame.classList.add('on');
    minigame.setAttribute('aria-hidden','false');
    spawnShape();
  }

  function spawnShape() {
    if (mgStep>=mgRound.length) { endMinigame(); return; }
    minigame.textContent=''; // idempotent: also lets a resize re-lay-out the live shape
    const {name,color}=mgRound[mgStep];
    const w=minigame.clientWidth, h=minigame.clientHeight;
    // Left to right across the top row. A seven-note tune is one row; a longer
    // one wraps back to the left for a second.
    const total=mgRound.length;
    const twoRows=total>ROW_MAX;
    const row=twoRows && mgStep>=ROW_MAX ? 1 : 0;
    const slot=row ? mgStep-ROW_MAX : mgStep;
    const slots=row ? total-ROW_MAX : Math.min(ROW_MAX,total);
    const frac=slots<=1 ? .5 : slot/(slots-1);
    // Only one shape is ever on screen, so neighbouring slots may overlap; the
    // height cap is what has to shrink to fit two rows.
    const size=Math.max(80,Math.min(w*.23, twoRows ? h*.36 : h*.52));
    const left=w*.13+frac*(w*.74);
    const top=twoRows ? h*(row ? .72 : .28) : h*.5;

    const el=document.createElement('div');
    el.className='mgShape';
    el.style.width=el.style.height=size+'px';
    el.style.left=left+'px';
    el.style.top=top+'px';
    el.innerHTML='<svg viewBox="0 0 100 100" fill="'+color+
                 '" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">'+
                 SHAPES[name]+'</svg>';
    minigame.appendChild(el);
    el.animate(
      [{transform:'translate(-50%,-50%) scale(.3)',opacity:0},
       {transform:'translate(-50%,-50%) scale(1.12)',opacity:1,offset:.7},
       {transform:'translate(-50%,-50%) scale(1)',opacity:1}],
      {duration:300,easing:'ease-out'});

    let popped=false;
    el.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      if (popped || mgBusy) return;
      popped=true; mgBusy=true;
      playPop();
      playTone(mgTune[mgStep],
               {dur: mgStep===mgTune.length-1 ? LAST_NOTE_DUR : NOTE_DUR, vol:.34});
      el.animate(
        [{transform:'translate(-50%,-50%) scale(1)',opacity:1},
         {transform:'translate(-50%,-50%) scale(1.55)',opacity:0}],
        {duration:260,easing:'ease-out'});
      setTimeout(()=>{ el.remove(); mgStep++; mgBusy=false; spawnShape(); },300);
    });
  }

  function endMinigame() {
    minigame.classList.remove('on');
    minigame.setAttribute('aria-hidden','true');
    minigame.textContent='';
    mgRound=[]; mgStep=0;
    const done=mgOnFinish; mgOnFinish=null;
    if (done) done();
  }

  // ------------------------------------------------------------ brain break ---
  // Every fourth completed task, Carl dances across the screen to his own
  // music. There is nothing to tap and no way to get it wrong - it is a rest
  // between pieces of work, not another thing to perform, so the layer is
  // deliberately inert and ends itself.
  const BRAIN_BREAK_SRC = 'audio/brainbreak/carlwin.wav';
  // Only used if the file never loads at all; the real length comes from the
  // audio element, and the end comes from its 'ended' event.
  const BRAIN_BREAK_FALLBACK = 10400;

  const brainbreak = document.getElementById('brainbreak');
  const carlEl = document.getElementById('carl');
  let bbClip=null, bbEnded=null, bbTimer=null, bbOnFinish=null;

  function brainBreakActive() { return brainbreak.classList.contains('on'); }

  function startBrainBreak(onFinish) {
    brushOff();
    bbOnFinish=onFinish;
    brainbreak.classList.add('on');
    brainbreak.setAttribute('aria-hidden','false');

    const a=clip(BRAIN_BREAK_SRC);
    // Same hand-off the spoken clips use: whatever was talking stops, and
    // goHome()'s currentClip.pause() can reach the music.
    if (currentClip && currentClip!==a) { try { currentClip.pause(); } catch {} }
    currentClip=a;
    try { a.pause(); a.currentTime=0; } catch {}

    // The walk lasts exactly as long as the music. duration is NaN until
    // metadata has loaded, which on a cold first play it has not.
    const secs=(a.duration && isFinite(a.duration)) ? a.duration : BRAIN_BREAK_FALLBACK/1000;
    // He crosses in a little under the full clip, so he is already off the
    // right edge when the last note lands rather than being cut off mid-stride
    // - and so a wrong duration estimate errs on the harmless side.
    carlEl.style.setProperty('--bbDur',(secs*.94).toFixed(2)+'s');
    // Restart the CSS animation from the top: without this the second break
    // of a session shows Carl already parked off the right edge, because
    // `forwards` holds him on the last keyframe.
    carlEl.style.animation='none';
    void carlEl.offsetWidth;
    carlEl.style.removeProperty('animation');

    // End on the audio's own 'ended' event, never on a timer alone - a timer
    // either clips the music or leaves the student watching a frozen Carl. The timer
    // is the backstop for a file that fails to play, which must not strand them.
    bbClip=a;
    bbEnded=()=>endBrainBreak();
    a.addEventListener('ended',bbEnded);
    bbTimer=setTimeout(bbEnded, secs*1000+1200);

    const played=a.play();
    if (played && played.catch) played.catch(()=>{});
  }

  function endBrainBreak() {
    if (!brainBreakActive()) return;
    clearTimeout(bbTimer); bbTimer=null;
    if (bbClip) {
      bbClip.removeEventListener('ended',bbEnded);
      try { bbClip.pause(); bbClip.currentTime=0; } catch {}
      bbClip=null;
    }
    bbEnded=null;
    brainbreak.classList.remove('on');
    brainbreak.setAttribute('aria-hidden','true');
    const done=bbOnFinish; bbOnFinish=null;
    if (done) done();
  }

  // ========================================================= rhythm section ===
  // Simon says, with a drum kit. The band plays one measure, the student plays
  // it back, and getting it right moves them on to a new one.
  //
  //   band's measure   targets GREYED OUT, shapes light on their beat
